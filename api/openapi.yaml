openapi: 3.0.3
info:
  title: Portal
  version: 0.9.0
  description: >-
    The one API of the portal. Everything on screen is a graph in the Graph.Node envelope (graph/1):
    Containers, Widgets, Layouts, Categories, States, Themes, Refs and Mounts, joined by contains, laid-out-by, is-a,
    displays, has-state, themed-by and opens edges (ontology.yaml, module Portal); the shell's menu is an envelope
    too, of Service and Page nodes. Every API path names the tenant (/api/tenants/{tenant}/...); one process serves
    the one tenant PORTAL_TENANT names, and any other tenant is 404. A request without a bearer token reads only;
    a write needs a token the tenant's tokens.yaml holds (401 without one), and a token it does not hold is refused
    on any request (401). A token belongs to a principal (principals.yaml) whose role decides what it may do: reader
    reads only, contributor writes everything but identity and settings, admin writes all; a write the role does not
    allow is 403. A principal creates principals of a role equal to or below its own (attenuation). Data layers are mounted read-only and queried; nothing here ever writes to a data layer. A contributor or admin publishes a card to one of the tenant's feeds, and every push is one line of the tenant's ledger. Source of
    truth for the API surface: the Go server (cmd/portal) is generated from this file by oapi-codegen v2.8.0 and
    the JS client in web/client.js is checked against it by the Go spec tests.
security:
  - {}
  - bearerAuth: []
tags:
  - name: screen
    description: The screen graph and its writes. Every write validates the whole next screen with Graph.Node and the portal ontology before it is accepted.
  - name: layers
    description: Mounted data layers, read-only.
  - name: snaps
    description: Snapshots of the screen graph on disk and the diff between two.
  - name: page
    description: The shell page, its routes and its assets.
  - name: tenant
    description: The tenant's merged config, its menu, who is calling, and its service connections.
  - name: identity
    description: The tenant's principals and their bearer tokens. Reads are open, as every read is; writes are admin only.
  - name: agents
    description: Agent runs, read from every mounted layer whose module is Graph.Emitter.Agent and grouped by the principal whose token mounted the layer (docs/design.md 43). Read-only.
  - name: emitters
    description: Emitters and the layers they produced (docs/design.md 44). An emitter is a card of type emitter in one of the tenant's feeds, served under the card's own id, or the module a mounted layer's ontology names when no feed holds its card. Read-only.
  - name: feeds
    description: Where the tenant publishes Graph.Node manifest cards (an OCI registry or a NuGet v3 feed), what each holds, and the push. Every push is one line of tenants/<tenant>/ledger.jsonl.
paths:
  /:
    get:
      operationId: getIndex
      tags: [page]
      summary: Redirects to the first page of the first service of the tenant this process serves, /<tenant>/<service>/<page>.
      responses:
        "302":
          description: To the shell's first page.
          headers:
            Location:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /{tenant}/{service}/{page}:
    get:
      operationId: getShellPage
      tags: [page]
      summary: The shell page (index.html) at a page route. The page reads the route from the URL, so a deep link survives a refresh. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/{service}/{page}/{id}:
    get:
      operationId: getShellItem
      tags: [page]
      summary: The shell page (index.html) at an item route, one node of a page. As getShellPage.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/layers/{name}:
    get:
      operationId: getLayerPage
      tags: [page, layers]
      summary: The shell page (index.html) at one mounted layer's page, which shows its name, node and edge counts, layer stamp and its nodes. mountLayer's Location points here. The literal layers segment wins over getShellPage's service, so no menu service may have the path layers. 404 when tenant is not this process's tenant or no layer of that name is mounted.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/agents:
    get:
      operationId: getAgentsPage
      tags: [page, agents]
      summary: The shell page (index.html) listing the tenant's agents, drawn under the menu's Page whose view is agents (Identity/Agents). Two segments, so no shell route competes. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/agents/{name}:
    get:
      operationId: getAgentPage
      tags: [page, agents]
      summary: The shell page (index.html) of one agent, its runs newest first. The literal agents segment wins over getShellPage's service, so no menu service may have the id agents. 404 when tenant is not this process's tenant or name is not an agent (listAgents).
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/emitters:
    get:
      operationId: getEmittersPage
      tags: [page, emitters]
      summary: The shell page (index.html) listing the tenant's emitters, drawn under the menu's Page whose view is emitters (Emitters/Catalogue). Two segments, so no shell route competes. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/emitters/{name}:
    get:
      operationId: getEmitterPage
      tags: [page, emitters]
      summary: The shell page (index.html) of one emitter, its layers newest first. The literal emitters segment wins over getShellPage's service, so this route also serves the shell for every page of the menu's emitters service (emitters/sources, emitters/runs, ...), which keep their paths. No emitter card can be named like one of those pages, since Graph.Node's manifest schema wants a dotted card name and a menu id has no dot, and boot refuses a ledger that holds one anyway (docs/design.md 44). 404 when tenant is not this process's tenant, or name is neither such a page nor an emitter (listEmitters).
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /static/{file}:
    get:
      operationId: getStatic
      tags: [page]
      summary: One static file by flat name (no subpaths), e.g. portal.js, client.js, cytoscape.min.js.
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File contents.
          content:
            text/javascript:
              schema: { type: string }
            text/css:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenant
      tags: [tenant]
      summary: The tenant this process serves and its mode, the overlay's mode (dev, demo or prod; prod when absent). The page draws the mode in the banner, an amber DEV MODE bar for dev and a blue DEMO bar for demo (docs/design.md 39).
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/dev-token:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getDevToken
      tags: [tenant]
      summary: >-
        The page's "Use dev token" sign-in. Exists only while the tenant's mode is dev, the request comes from
        127.0.0.1 (or ::1) with a loopback Host, and the binary was started with PORTAL_TOKEN set to a token of the
        dev-bootstrap principal that the tenant still holds (Invoke-Build Dev does all three). Anything else is 404,
        as if the route were not there. Anonymous may call it: it is how an anonymous tab signs in (docs/design.md 39).
      responses:
        "200":
          description: The dev-bootstrap token, to send as the bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/screen:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getScreen
      tags: [screen]
      summary: The current screen graph. With PORTAL_MODE=production, every node with an is-a edge to the Designer Category is left out, with the edges that touch it.
      responses:
        "200":
          description: The screen envelope (module Portal).
          headers:
            X-Portal-Boot:
              required: true
              description: What this process booted the screen from. The stamp of a snap under artifacts/snaps (PORTAL_SNAP when set, else the newest), or seed (no snap; the dev seed), or empty (no snap and -no-seed).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/config:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getConfig
      tags: [tenant]
      summary: The tenant's config, portal.base.yaml with tenants/<tenant>/portal.yaml deep-merged over it, as decoded from YAML. Both files pass schema/portal.schema.json at boot or the binary stops.
      responses:
        "200":
          description: The merged config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/menu:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getMenu
      tags: [tenant]
      summary: The left rail as an envelope built from the merged config's menu. One Service node per service (ui:rail:<service>), one Page per page below it (ui:rail:<service>:<page>, and so on for an item page's tabs), has-page from parent to child, and an icon State (ui:state:rail:...) joined by has-state. order sorts siblings. Validated with Graph.Node and the portal ontology at boot.
      responses:
        "200":
          description: The menu envelope (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/auth/whoami:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getWhoami
      tags: [tenant]
      summary: Who the request is. No Authorization header is anonymous and reads only; a bearer token the tenant holds is its principal, with that principal's role (a token from before 0.5.0 that names no principal is legacy, an admin named after the token). A token it does not hold is 401.
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/principals:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listPrincipals
      tags: [identity]
      summary: The tenant's principals (tenants/<tenant>/principals.yaml) as an envelope of Principal nodes, id ui:principal:<name>, in file order. properties.createdBy is the creator's id, absent only on the first admin.
      responses:
        "200":
          description: The principals (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postPrincipal
      tags: [identity]
      summary: Create a principal of type user, recorded in principals.yaml with createdBy the caller's id. By attenuation, never of a role above the caller's (403); and identity, so admin only (403). A token from before 0.5.0 has no principal to record and is refused (403). Issue the new principal's token with New-PortalToken -Name <name>.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrincipalRequest" }
      responses:
        "201":
          description: The principal, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/tenants/{tenant}/tokens:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listTokens
      tags: [identity]
      summary: The tenant's bearer tokens (tenants/<tenant>/tokens.yaml), in file order, by owner and the first 12 hex digits of the token's SHA-256. Never a token, never a whole hash.
      responses:
        "200":
          description: One summary per token.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: A TokenSummary id, the first 12 hex digits of the token's SHA-256.
        schema: { type: string }
    delete:
      operationId: revokeToken
      tags: [identity]
      summary: Revoke a token, removing it from tokens.yaml; it is refused from the next request on. Admin only (403).
      responses:
        "200":
          description: The token revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/connections:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listConnections
      tags: [tenant]
      summary: The tenant's service connections (tenants/<tenant>/connections.yaml), without secrets. token_env is the name of the variable holding the secret; tokenSet says whether this process has it.
      responses:
        "200":
          description: One summary per connection, in file order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/connections/{name}/repos:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getConnectionRepos
      tags: [tenant]
      summary: For a connection of type github, the repositories its token can see (GET <url>/user/repos, every page up to 1000), as an envelope of git.repository nodes, id ui:conn:<connection>/<owner>/<repo>. Read only; nothing is stored. Needs a bearer token though it is a GET, since it spends the tenant's secret (401 without one). 422 when the token variable is not set; 502 when GitHub fails or refuses.
      responses:
        "200":
          description: The repositories (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/tenants/{tenant}/feeds:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listFeeds
      tags: [feeds]
      summary: The tenant's feeds (the merged config's feeds) as an envelope of Feed nodes, ui:feed:<id>, in config order, with every card pushed to each as a Card node, ui:card:<feed>/<name>@<version> (version, type, content hash, digest, pushed, pushedBy), joined Feed to Card by has-card. The cards come from the tenant's ledger, its pushed entries.
      responses:
        "200":
          description: The feeds and their cards (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/agents:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listAgents
      tags: [agents]
      summary: The tenant's agents as an envelope (module Portal). An agent is a Principal node, ui:principal:<name>, as listPrincipals serves it. Each principal of type agent is one, and so is each principal whose token mounted a layer holding a Run. Every Run node of every mounted layer whose module is Graph.Emitter.Agent is a Run node here under its own id, agent:run/<stamp>, carrying its layer, its stamps, its step count and its decisions counted by effect (allow, deny, witness), and is joined Principal to Run by has-run. A layer mounted with no principal's token (a token from before 0.5.0, or a -mount flag at start) hangs its runs off dev-bootstrap. A Run id in two layers is served once, from the layer with the later stamp.
      responses:
        "200":
          description: The agents and their runs (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/agents/{name}/runs:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: name, in: path, required: true, description: "The principal's name, the tail of ui:principal:<name>.", schema: { type: string } }
    get:
      operationId: listAgentRuns
      tags: [agents]
      summary: One agent's runs, newest first by startedAt, as an envelope (module Portal) of the Principal, its Run nodes (as listAgents serves them) and each Run's Decision nodes, one per PolicyDecision of the layer under its own id (effect, phase, rule, step, reason), joined has-run and has-decision. 404 when name is not one of listAgents' principals.
      responses:
        "200":
          description: The agent, its runs and their decisions (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/emitters:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listEmitters
      tags: [emitters]
      summary: The tenant's emitters as an envelope (module Portal), by name. An emitter is named by the module its layers carry, the module of a mounted layer's ontology (Graph.Emitter.Agent); a card of type emitter named Emitter.<X> is the emitter Graph.Emitter.<X>, one named otherwise is the emitter of its own name. An emitter some feed holds a card of is that Card node, under the card's own id ui:card:<feed>/<name>@<version> as listFeeds serves it (the newest push when several cards name it), with emitter (its name) and layers (how many mounted layers it produced). An emitter a mounted layer names with no card in any feed is an Emitter node, ui:emitter:<name>, with unknown true and layers. Every mounted layer is a Layer node, ui:layer:<name> (emitter, module, version, stamp, node and edge counts, mountedBy, path), joined Layer to its emitter by produced-by and back by has-layer.
      responses:
        "200":
          description: The emitters and the layers they produced (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/emitters/{name}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: name, in: path, required: true, description: "The emitter's name, as listEmitters serves it (Graph.Emitter.Agent).", schema: { type: string } }
    get:
      operationId: getEmitter
      tags: [emitters]
      summary: One emitter as an envelope (module Portal) rooted at its node (as listEmitters serves it), with the Layer nodes of every mounted layer it produced, newest first by stamp, joined produced-by and has-layer. 404 when name is not one of listEmitters' emitters.
      responses:
        "200":
          description: The emitter and its layers (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/feeds/{feed}/push:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: feed
        in: path
        required: true
        description: A feed id from GET .../feeds.
        schema: { type: string }
    post:
      operationId: pushCard
      tags: [feeds]
      summary: >-
        Publish one card: its manifest.yaml and the files of its folder. The manifest is checked with Graph.Node 0.3.0's
        manifest schema (the lifted graph.ValidateManifest), and each file's path (the part's filename, relative to
        the card's folder, forward slashes) must be clean. An oci feed gets an OCI artifact (repository: the feed URL's
        path and the card's name in lower case; tag: the version), a nuget feed a .nupkg (id: the card's name). Contributor
        or admin (403 for a reader, 401 without a token). A name and version the ledger or the feed already holds is 409.
        Every push that names a feed the tenant has is one line of the tenant's ledger, whatever its result (pushed,
        duplicate, invalid, failed); the 201 body is that line.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: string
                  format: binary
                  description: The card's manifest.yaml.
                file:
                  type: array
                  description: Every other file of the card's folder, one part each; the part's filename is the path relative to the folder.
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Pushed; the ledger entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/tenants/{tenant}/nodes:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listNodes
      tags: [screen, layers]
      summary: Every node of one Kind on the screen (as getScreen shows it) and in every mounted layer, read-only, first id wins. A node with no stamp gets stamp.layer from the envelope it came from. Nodes only.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: An envelope of the matching nodes (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postNode
      tags: [screen]
      summary: Add one node. The body is a Graph.Node node. Rejected unless the next screen passes Graph.Node validation and the portal ontology checks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Node" }
      responses:
        "201":
          description: The validated node, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    patch:
      operationId: patchNode
      tags: [screen]
      summary: Change a node's properties and its display State, nothing else. A property set to null is removed. state upserts the node's State node (ui:state:<id without ui:>) and its has-state edge.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchRequest" }
      responses:
        "200":
          description: The validated node and, when state was given, its State node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteNode
      tags: [screen]
      summary: Remove a node and every edge that touches it.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: The removed node and the ids of the removed edges.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/tenants/{tenant}/edges:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: postEdge
      tags: [screen]
      summary: Add one edge. The body is a Graph.Node edge; id may be left out and is then set to from|to|kind. Rejected unless the next screen validates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeInput" }
      responses:
        "201":
          description: The validated edge, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/layers:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listLayers
      tags: [layers]
      summary: The mounted data layers, in mount order.
      responses:
        "200":
          description: One summary per layer.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LayerSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: mountLayer
      tags: [layers]
      summary: Mount a layer from a path on disk (a .graph.json file, or a directory whose newest *.graph.json is taken) or from an envelope in the body. Refused with the Graph.Node problem codes when graphnode validate would fail. Mounting an existing name replaces it. A mount by path also records itself on the screen as the Mount node ui:mount:<name> holding the path as given (made absolute), so an approved snap mounts it again at boot; a mount by envelope removes that node. Mounts are otherwise held in memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MountRequest" }
      responses:
        "201":
          description: The mounted layer.
          headers:
            Location:
              required: true
              description: The layer's page, /<tenant>/layers/<name> (getLayerPage).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/layers:
    post:
      operationId: mountLayerUnscoped
      deprecated: true
      tags: [layers]
      summary: Gone since 0.7.0. mountLayer's path before 0.4.0; it mounts nothing and answers 410 with a message naming POST /api/tenants/<tenant>/layers. A request with a token the tenant does not hold is still 401, and a write without a token too, as for any write.
      responses:
        "410": { $ref: "#/components/responses/Gone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}/layers/{name}/nodes:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getLayerNodes
      tags: [layers]
      summary: Query one mounted layer. kind keeps nodes of that Kind; from keeps the node with that id and every node reachable from it along edges in their direction. Edges are kept when both ends survive.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: An envelope holding the matching nodes and edges of that layer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}/snap:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: postSnap
      tags: [snaps]
      summary: Approve the screen. Writes the screen graph to artifacts/snaps/<stamp>.graph.json, with ontology.yaml beside it and the note as the envelope's one finding of Kind approved, and reports what it added, removed and changed against the snap before it. The newest snap is what the next start boots from.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapRequest" }
      responses:
        "201":
          description: The snap written, and its diff against the previous snap (absent for the first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/diff:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getDiff
      tags: [snaps]
      summary: Merge snap a then snap b the Graph.Node design 11 way, read-only, and report what b added, removed and changed. Stamps are compared as given; nothing is written.
      parameters:
        - name: a
          in: query
          required: true
          schema: { type: string }
        - name: b
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The diff and the merged envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}/ontology:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getOntology
      tags: [screen, layers]
      summary: The portal ontology and the ontology of every mounted layer (null when a layer names none or it could not be read).
      responses:
        "200":
          description: Ontologies, as decoded from YAML.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologySet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A token whose SHA-256 is in tenants/<tenant>/tokens.yaml, belonging to a principal in principals.yaml. Needed to write; optional to read. The principal's role decides which writes.
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: The tenant this process serves (PORTAL_TENANT, default "default"). Any other is 404.
      schema: { type: string }
    NodeId:
      name: id
      in: path
      required: true
      description: Screen node id, e.g. ui:canvas. URL-encode it.
      schema: { type: string }
  responses:
    BadRequest:
      description: The body is not JSON of the right shape, or a parameter is missing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such node, layer, snap or file.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: A node or edge with that id already exists, or a feed already holds that card at that version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Validation failed. problems lists every Graph.Node and portal problem found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A write without a bearer token, or any request with a token the tenant does not hold.
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The principal's role does not allow this. A reader writes nothing; a contributor writes no identity or settings; no principal creates one of a role above its own (attenuation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: The service a connection or a feed names failed or answered with an error; message carries its status and message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: The path no longer serves; message names the one that does.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    TenantInfo:
      type: object
      required: [name, mode]
      additionalProperties: false
      properties:
        name: { type: string }
        mode:
          type: string
          enum: [dev, demo, prod]
          description: The overlay's mode; prod when it names none.
    DevToken:
      type: object
      required: [token, principal, role]
      additionalProperties: false
      properties:
        token:
          type: string
          description: A bearer token of the dev-bootstrap principal. DEV ONLY.
        principal:
          type: string
          description: ui:principal:dev-bootstrap.
        role:
          type: string
          description: admin.
    Config:
      type: object
      description: The merged config; schema/portal.schema.json is authoritative.
      required: [product, menu, mode]
      additionalProperties: true
      properties:
        mode:
          type: string
          enum: [dev, demo, prod]
          description: What the tenant is run for; prod when the overlay names none (docs/design.md 39).
        product:
          type: object
          required: [name]
          properties:
            name: { type: string }
            help: { type: string }
        theme:
          type: object
          description: The shell's own settings, not node display (State and Theme nodes hold that).
          properties:
            graph:
              type: object
              properties:
                wheelZoomSpeed:
                  type: number
                  minimum: 0.1
                  maximum: 5
                  description: Scales the Canvas's mouse-wheel zoom step; 1.0 (the base's) is the product's step.
        menu:
          type: array
          items: { type: object, additionalProperties: true }
    Principal:
      type: object
      required: [id, name, type, role, anonymous, legacy, writes, administers, tenant]
      properties:
        id:
          type: string
          nullable: true
          description: ui:principal:<name>; null for anonymous and for a legacy token.
        name:
          type: string
          description: The principal's name, a legacy token's name in tokens.yaml, or anonymous.
        type:
          type: string
          nullable: true
          description: user or agent; null for anonymous and for a legacy token.
        role:
          type: string
          nullable: true
          description: reader, contributor or admin; null for anonymous, admin for a legacy token.
        anonymous: { type: boolean }
        legacy:
          type: boolean
          description: A token from before 0.5.0 that names no principal; it acts as admin until rotated.
        writes:
          type: boolean
          description: Whether this principal may write at all (contributor or admin).
        administers:
          type: boolean
          description: Whether this principal may write identity and settings (admin).
        tenant: { type: string }
        marker:
          type: string
          nullable: true
          description: Who holds the tenant's marker. Nothing issues markers yet, so always null.
    ConnectionSummary:
      type: object
      required: [name, type, url, token_env, tokenSet, createdBy]
      properties:
        name: { type: string }
        type: { type: string, enum: [github] }
        url: { type: string }
        token_env:
          type: string
          description: The name of the environment variable holding the secret; never the secret.
        tokenSet:
          type: boolean
          description: Whether that variable is set in the portal's environment.
        createdBy:
          type: string
          nullable: true
          description: The id of the principal who made the connection (connections.yaml created_by); null in a file from before 0.5.0.
    PrincipalRequest:
      type: object
      required: [name, role]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Lower-case letters, digits, dot, underscore and dash, starting with a letter or digit, at most 64; the id is ui:principal:<name>.
        role:
          type: string
          description: reader, contributor or admin; at most the caller's.
        type:
          type: string
          description: user, the default and the only type created here (agents are minted via Marker, later).
    TokenSummary:
      type: object
      required: [id, principal, name, created, legacy]
      properties:
        id:
          type: string
          description: The first 12 hex digits of the token's SHA-256.
        principal:
          type: string
          nullable: true
          description: The owner's id; null for a legacy token.
        name:
          type: string
          description: The owner's name, or a legacy token's own.
        created:
          type: string
          nullable: true
          description: When New-PortalToken minted it; null for a legacy token.
        legacy: { type: boolean }
    LedgerEntry:
      type: object
      description: One line of tenants/<tenant>/ledger.jsonl, one per push (docs/design.md 40).
      required: [at, principal, name, role, feed, kind, card, version, type, hash, digest, files, result, message]
      additionalProperties: false
      properties:
        at: { type: string, description: "When, UTC (2026-10-11T09:00:00.000Z)." }
        principal: { type: string, nullable: true, description: "Who pushed: ui:principal:<name>; null for a legacy token." }
        name: { type: string, description: "The principal's name, or a legacy token's." }
        role: { type: string, description: "contributor or admin." }
        feed: { type: string, description: "The feed id." }
        kind: { type: string, enum: [oci, nuget] }
        card: { type: string, nullable: true, description: "The card's name; null when the manifest did not say." }
        version: { type: string, nullable: true }
        type: { type: string, nullable: true, description: "emitter, skill, tool or rule." }
        hash: { type: string, nullable: true, description: "sha256:<hex> over the card's files (one line per file sorted by path: path, tab, the file's sha256, newline); null for an invalid card." }
        digest: { type: string, nullable: true, description: "What the feed stored: the OCI manifest digest or the .nupkg's sha256. Set only when pushed." }
        files: { type: integer, description: "How many files, manifest.yaml included." }
        result: { type: string, enum: [pushed, duplicate, invalid, failed] }
        message: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
    Problem:
      type: object
      description: One validation failure. Graph.Node codes (schema, duplicate-node, duplicate-edge, dangling-edge, edge-id, edgeid, counts, kind, stamp, display, action) and portal codes (id-prefix, unknown-kind, unknown-property, property-type, display, unknown-edge-kind, edge-endpoints, unknown-category, unknown-ref, unknown-field, ontology).
      required: [code, path, message]
      properties:
        code: { type: string }
        path: { type: string }
        message: { type: string }
        severity:
          type: string
          enum: [error, warning]
          description: Graph.Node 0.2.0 severity. A refusal carries errors only; a layer ontology's ontologyProblems may hold warnings.
    Counts:
      type: object
      required: [nodes, edges]
      properties:
        nodes: { type: integer }
        edges: { type: integer }
        byKind:
          type: object
          additionalProperties: { type: integer }
    Envelope:
      type: object
      description: A Graph.Node envelope (graph/1). The schemas in internal/graphnode/schemas are authoritative.
      required: [schema, module, layer, nodes, edges]
      properties:
        schema:
          type: string
          enum: [graph/1]
        ontology: { type: string }
        module: { type: string }
        version: { type: string }
        layer: { type: string }
        root: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        counts: { $ref: "#/components/schemas/Counts" }
    Node:
      type: object
      description: A Graph.Node node. A display key is refused (Graph.Node), and so are display properties on any Kind but State and Theme (portal).
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        properties: { $ref: "#/components/schemas/Properties" }
        source:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        stamp: { $ref: "#/components/schemas/Stamp" }
    Edge:
      type: object
      required: [id, kind, from, to]
      properties:
        id:
          type: string
          description: from + "|" + to + "|" + kind
        kind: { type: string }
        from: { type: string }
        to: { type: string }
        properties: { $ref: "#/components/schemas/Properties" }
        source:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        stamp: { $ref: "#/components/schemas/Stamp" }
    EdgeInput:
      type: object
      description: An Edge whose id may be left out.
      required: [kind, from, to]
      properties:
        id: { type: string }
        kind: { type: string }
        from: { type: string }
        to: { type: string }
        properties: { $ref: "#/components/schemas/Properties" }
    Properties:
      type: object
      additionalProperties: true
    SourceRef:
      type: object
      properties:
        tool: { type: string }
        command: { type: string }
        path: { type: string }
        file: { type: string }
        line: { type: integer }
    Stamp:
      type: object
      properties:
        layer: { type: string }
        firstSeen: { type: string }
        lastSeen: { type: string }
    Finding:
      type: object
      required: [kind, message]
      additionalProperties: true
      properties:
        kind: { type: string }
        severity: { type: string }
        message: { type: string }
        target: { type: string }
    StateProperties:
      type: object
      additionalProperties: false
      properties:
        collapsed: { type: boolean, nullable: true }
        selected: { type: boolean, nullable: true }
        scroll:
          type: object
          nullable: true
          properties:
            x: { type: number }
            y: { type: number }
    PatchRequest:
      type: object
      additionalProperties: false
      properties:
        properties: { $ref: "#/components/schemas/Properties" }
        state: { $ref: "#/components/schemas/StateProperties" }
    PatchResult:
      type: object
      required: [node]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        state: { $ref: "#/components/schemas/Node" }
    DeleteResult:
      type: object
      required: [node, edges]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        edges:
          type: array
          items: { type: string }
    MountRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        path:
          type: string
          description: A .graph.json file, or a directory whose newest *.graph.json (by name) is mounted. The envelope's ontology is resolved relative to the file.
        envelope:
          type: object
          additionalProperties: true
          description: An envelope given inline. Exactly one of path and envelope.
    LayerSummary:
      type: object
      required: [name, module, stamp, counts, hasOntology]
      properties:
        name: { type: string }
        module: { type: string }
        version: { type: string }
        stamp:
          type: string
          description: The envelope's layer stamp.
        path:
          type: string
          description: The file mounted, when mounted from disk.
        mountedBy:
          type: string
          description: Id of the principal whose token mounted the layer (ui:principal:<name>). Absent when none did, a token from before 0.5.0 or a -mount flag at start; listAgents then hangs its runs off dev-bootstrap.
        counts: { $ref: "#/components/schemas/Counts" }
        hasOntology: { type: boolean }
        ontologyProblems:
          type: array
          description: Present when the layer names an ontology that could not be read or failed graphnode validate-ontology; the layer is mounted without it and draws grey.
          items: { $ref: "#/components/schemas/Problem" }
    SnapRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
          description: Why this screen is approved. Stored as the snap envelope's approved finding.
    SnapResult:
      type: object
      required: [stamp, layer, path, counts, note]
      properties:
        stamp:
          type: string
          description: File-safe stamp, the snap's name (2026-10-09T01-02-03.456Z).
        layer:
          type: string
          description: The envelope's layer, UTC ending Z (2026-10-09T01:02:03.456Z).
        path: { type: string }
        counts: { $ref: "#/components/schemas/Counts" }
        note: { type: string, description: "The note as given, trimmed; empty when none." }
        previous:
          type: string
          description: Stamp of the newest snap before this one. Absent for the first snap.
        diff: { $ref: "#/components/schemas/DiffSummary" }
    Ids:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { type: string }
        edges:
          type: array
          items: { type: string }
    DiffSummary:
      type: object
      description: Ids of what this snap added, removed and changed against previous; GET /api/diff gives the full diff.
      required: [added, removed, changed]
      properties:
        added: { $ref: "#/components/schemas/Ids" }
        removed: { $ref: "#/components/schemas/Ids" }
        changed: { $ref: "#/components/schemas/Ids" }
    Delta:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
