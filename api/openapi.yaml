openapi: 3.0.3
info:
  title: Portal
  version: 0.16.1
  description: >-
    The one API of the portal. Everything on screen is a graph in the Graph.Node envelope (graph/1):
    Containers, Widgets, Layouts, Categories, States, Themes, Refs and Mounts, joined by contains, laid-out-by, is-a,
    displays, has-state, themed-by and opens edges (ontology.yaml, module Portal); the shell's menu is an envelope
    too, of Service and Page nodes. Every API path names the tenant (/api/tenants/{tenant}/...); one process serves
    the one tenant PORTAL_TENANT names, and any other tenant is 404. A request without a bearer token reads only;
    a write needs a token the tenant's tokens.yaml holds (401 without one), and a token it does not hold is refused
    on any request (401). A token belongs to a principal (principals.yaml) whose role decides what it may do: reader
    reads only, contributor writes everything but identity and settings, admin writes all; a write the role does not
    allow is 403. A principal creates principals of a role equal to or below its own (attenuation). Data layers are mounted read-only and queried; nothing here ever writes to a data layer. A contributor or admin publishes a card to one of the tenant's feeds, and every push is one line of the tenant's ledger. A contributor or admin asks for an action on a container, as one line of the same ledger; Portal never executes it. Source of
    truth for the API surface: the Go server (cmd/portal) is generated from this file by oapi-codegen v2.8.0 and
    the JS client in web/client.js is checked against it by the Go spec tests.
security:
  - {}
  - bearerAuth: []
tags:
  - name: screen
    description: The screen graph and its writes. Every write validates the whole next screen with Graph.Node and the portal ontology before it is accepted.
  - name: layers
    description: >-
      Mounted data layers, read-only. One is Portal's own (docs/design.md 55): tenant-actions, the tenant's ledger.jsonl
      as a layer, built at boot and rebuilt whenever the file grows, mounted while the ledger holds an action line; its name
      is reserved.
  - name: snaps
    description: Snapshots of the screen graph on disk and the diff between two.
  - name: page
    description: The shell page, its routes and its assets.
  - name: tenant
    description: The tenant's merged config, its menu, who is calling, and its service connections.
  - name: identity
    description: The tenant's principals and their bearer tokens. Reads are open, as every read is; writes are admin only.
  - name: agents
    description: Agent runs, read from every mounted layer whose module is Graph.Emitter.Agent and grouped by the principal whose token mounted the layer (docs/design.md 43). Read-only.
  - name: emitters
    description: Emitters and the layers they produced (docs/design.md 44). An emitter is a card of type emitter in one of the tenant's feeds, served under the card's own id, or the module a mounted layer's ontology names when no feed holds its card. Read-only.
  - name: ledger
    description: Ledger chains and their verify (docs/design.md 45). Source agent is the agent's ledger, read from the mounted layer that holds LedgerEntry nodes under ledger:<seq> ids; source portal is the tenant's ledger, tenants/<tenant>/ledger.jsonl, whose lines carry seq and prev since 0.10.0 (pushes, action requests and the Runner's results, one chain and one seq space, docs/design.md 50), read again from the file's tail on every read. Read-only.
  - name: environments
    description: The environments graph (docs/design.md 46). Every node of an environment.* Kind under an env:compose/, env:container/, env:image/ or env:network/ id in the mounted layers, as their layers emit them, with every edge of a mounted layer that touches one and the node at its other end. Read-only; Portal reads env, tags and group from the nodes and infers none.
  - name: graph
    description: The tenant graph (docs/design.md 53). Every node and edge of the mounted layers as one envelope, as their layers emit them; source keeps the nodes of the layers whose Graph.Node source block names one emitter. Read-only. Since 0.16.0 one breadth-first query (docs/design.md 54) answers multi-hop questions across them, and the tenant graph is that query with every node a start and depth 0.
  - name: alerts
    description: Alerts (docs/design.md 47), read from every mounted layer holding nodes of Kind alert under the id alert:<fingerprint>, 64 lower-case hex (Portal.Agent's alert layer); any other id is no alert, and nothing maps one (docs/design.md 48), each with an about edge to its subject and a raised-in edge to its Run. A fingerprint in two layers is served from the later stamp. Read-only; Portal never writes an alert.
  - name: actions
    description: >-
      Actions on containers (docs/design.md 50). Portal asks, the Runner executes, the ledger records, the graph shows the gap.
      A request is one action.request line of tenants/<tenant>/ledger.jsonl (kind, id ledger:tenant/<tenant>/<seq>, action,
      subject, principal, requested, status, then seq and prev), written as the token's principal; Portal never executes
      anything. Portal.Agent's Runner answers with an action.result line of the same file (kind, id
      ledger:tenant/<tenant>/<seq>, request the request's id, status done or failed, started, finished, exit, output, source,
      then seq and prev), appended under the same file lock with the same seq and prev: one ledger, one chain. Portal reads
      results from that file only, never from a mounted layer or an alert layer's copies. Ids (docs/api/actions.md, docs/design.md
      55): until 0.16.0 both carried ledger:<seq>, the agent chain's form; at boot such a line is rewritten in place
      (legacyId keeping the old id, prev rewritten to keep the chain, the file copied beside it first), and a line still in
      that form, a Runner's from before it took the new one, is read as this tenant's.
  - name: feeds
    description: Where the tenant publishes Graph.Node manifest cards (an OCI registry or a NuGet v3 feed), what each holds, and the push. Every push is one line of tenants/<tenant>/ledger.jsonl.
paths:
  /:
    get:
      operationId: getIndex
      tags: [page]
      summary: Redirects to the first page of the first service of the tenant this process serves, /<tenant>/<service>/<page>.
      responses:
        "302":
          description: To the shell's first page.
          headers:
            Location:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /{tenant}/{service}/{page}:
    get:
      operationId: getShellPage
      tags: [page]
      summary: The shell page (index.html) at a page route. The page reads the route from the URL, so a deep link survives a refresh. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/{service}/{page}/{id}:
    get:
      operationId: getShellItem
      tags: [page]
      summary: The shell page (index.html) at an item route, one node of a page. As getShellPage.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/layers/{name}:
    get:
      operationId: getLayerPage
      tags: [page, layers]
      summary: The shell page (index.html) at one mounted layer's page, which shows its name, node and edge counts, layer stamp and its nodes. mountLayer's Location points here. The literal layers segment wins over getShellPage's service, so no menu service may have the path layers. 404 when tenant is not this process's tenant or no layer of that name is mounted.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/agents:
    get:
      operationId: getAgentsPage
      tags: [page, agents]
      summary: The shell page (index.html) listing the tenant's agents, drawn under the menu's Page whose view is agents (Identity/Agents). Two segments, so no shell route competes. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/agents/{name}:
    get:
      operationId: getAgentPage
      tags: [page, agents]
      summary: The shell page (index.html) of one agent, its runs newest first. The literal agents segment wins over getShellPage's service, so no menu service may have the id agents. 404 when tenant is not this process's tenant or name is not an agent (listAgents).
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/emitters:
    get:
      operationId: getEmittersPage
      tags: [page, emitters]
      summary: The shell page (index.html) listing the tenant's emitters, drawn under the menu's Page whose view is emitters (Emitters/Catalogue). Two segments, so no shell route competes. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/emitters/{name}:
    get:
      operationId: getEmitterPage
      tags: [page, emitters]
      summary: The shell page (index.html) of one emitter, built from its card (module, version, repo, url, emits) with its layers newest first, each with its source block's version, target and stamp (docs/design.md 49). The literal emitters segment wins over getShellPage's service, so this route also serves the shell for every page of the menu's emitters service (emitters/sources, emitters/runs, ...), which keep their paths. No emitter card can be named like one of those pages, since Graph.Node's manifest schema wants a dotted card name and a menu id has no dot, and boot refuses a ledger that holds one anyway (docs/design.md 44). 404 when tenant is not this process's tenant, or name is neither such a page nor an emitter (listEmitters).
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/ledger:
    get:
      operationId: getLedgerPage
      tags: [page, ledger]
      summary: The shell page (index.html) listing the tenant's ledger chains, drawn under the menu's Page whose view is ledger (Ledger/Entries). Two segments, so no shell route competes. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/ledger/{source}:
    get:
      operationId: getLedgerSourcePage
      tags: [page, ledger]
      summary: The shell page (index.html) of one chain's entries, newest first. The literal ledger segment wins over getShellPage's service, so this route also serves the shell for every page of the menu's ledger service (ledger/entries, ledger/verify, ledger/keys), which keep their paths; boot refuses a ledger page with the id of a source (docs/design.md 45). 404 when tenant is not this process's tenant, or source is neither such a page nor a chain listLedgers serves.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: source, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/ledger/{source}/{seq}:
    get:
      operationId: getLedgerEntryPage
      tags: [page, ledger]
      summary: The shell page (index.html) of one entry of a chain. As getShellItem when source is a page of the menu's ledger service, which this literal route also serves. 404 when tenant is not this process's tenant, or source and seq name no page item and no entry (getLedgerEntry).
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: seq, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/actions:
    get:
      operationId: getActionsPage
      tags: [page, actions]
      summary: The shell page (index.html) listing the tenant's action requests, drawn under the menu's Page whose view is actions (Environments/Actions). Two segments, so no shell route competes. A request's own page is its ledger entry's, /<tenant>/ledger/portal/<seq>. 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{tenant}/graph:
    get:
      operationId: getGraphPage
      tags: [page, graph]
      summary: >-
        The shell page (index.html) drawing the tenant graph (getTenantGraph), under the menu's Page whose view is graph (Graph/Nodes).
        Two segments, so no shell route competes; the Graph service's pages keep /<tenant>/graph/<page>. The page passes its
        source query parameter on to getTenantGraph and shows it as a chip whose X links to /<tenant>/graph, so a filtered
        graph is a link (/<tenant>/graph?source=Emitter.Terraform). 404 when tenant is not this process's tenant.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/GraphSource"
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /static/{file}:
    get:
      operationId: getStatic
      tags: [page]
      summary: One static file by flat name (no subpaths), e.g. portal.js, client.js, cytoscape.min.js.
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File contents.
          content:
            text/javascript:
              schema: { type: string }
            text/css:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenant
      tags: [tenant]
      summary: The tenant this process serves and its mode, the overlay's mode (dev, demo or prod; prod when absent). The page draws the mode in the banner, an amber DEV MODE bar for dev and a blue DEMO bar for demo (docs/design.md 39).
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/dev-token:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getDevToken
      tags: [tenant]
      summary: >-
        The page's "Use dev token" sign-in. Exists only while the tenant's mode is dev, the request comes from
        127.0.0.1 (or ::1) with a loopback Host, and the binary was started with PORTAL_TOKEN set to a token of the
        dev-bootstrap principal that the tenant still holds (Invoke-Build Dev does all three). Anything else is 404,
        as if the route were not there. Anonymous may call it: it is how an anonymous tab signs in (docs/design.md 39).
      responses:
        "200":
          description: The dev-bootstrap token, to send as the bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/screen:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getScreen
      tags: [screen]
      summary: The current screen graph. With PORTAL_MODE=production, every node with an is-a edge to the Designer Category is left out, with the edges that touch it.
      responses:
        "200":
          description: The screen envelope (module Portal).
          headers:
            X-Portal-Boot:
              required: true
              description: What this process booted the screen from. The stamp of a snap under artifacts/snaps (PORTAL_SNAP when set, else the newest), or seed (no snap; the dev seed), or empty (no snap and -no-seed).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/config:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getConfig
      tags: [tenant]
      summary: The tenant's config, portal.base.yaml with tenants/<tenant>/portal.yaml deep-merged over it, as decoded from YAML. Both files pass schema/portal.schema.json at boot or the binary stops.
      responses:
        "200":
          description: The merged config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/menu:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getMenu
      tags: [tenant]
      summary: The left rail as an envelope built from the merged config's menu. One Service node per service (ui:rail:<service>), one Page per page below it (ui:rail:<service>:<page>, and so on for an item page's tabs), has-page from parent to child, and an icon State (ui:state:rail:...) joined by has-state. order sorts siblings. Validated with Graph.Node and the portal ontology at boot.
      responses:
        "200":
          description: The menu envelope (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/auth/whoami:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getWhoami
      tags: [tenant]
      summary: Who the request is. No Authorization header is anonymous and reads only; a bearer token the tenant holds is its principal, with that principal's role (a token from before 0.5.0 that names no principal is legacy, an admin named after the token). A token it does not hold is 401.
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/principals:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listPrincipals
      tags: [identity]
      summary: The tenant's principals (tenants/<tenant>/principals.yaml) as an envelope of Principal nodes, id ui:principal:<name>, in file order. properties.createdBy is the creator's id, absent only on the first admin.
      responses:
        "200":
          description: The principals (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postPrincipal
      tags: [identity]
      summary: Create a principal of type user, recorded in principals.yaml with createdBy the caller's id. By attenuation, never of a role above the caller's (403); and identity, so admin only (403). A token from before 0.5.0 has no principal to record and is refused (403). Issue the new principal's token with New-PortalToken -Name <name>.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrincipalRequest" }
      responses:
        "201":
          description: The principal, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/tenants/{tenant}/tokens:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listTokens
      tags: [identity]
      summary: The tenant's bearer tokens (tenants/<tenant>/tokens.yaml), in file order, by owner and the first 12 hex digits of the token's SHA-256. Never a token, never a whole hash.
      responses:
        "200":
          description: One summary per token.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: A TokenSummary id, the first 12 hex digits of the token's SHA-256.
        schema: { type: string }
    delete:
      operationId: revokeToken
      tags: [identity]
      summary: Revoke a token, removing it from tokens.yaml; it is refused from the next request on. Admin only (403).
      responses:
        "200":
          description: The token revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/connections:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listConnections
      tags: [tenant]
      summary: The tenant's service connections (tenants/<tenant>/connections.yaml), without secrets. token_env is the name of the variable holding the secret; tokenSet says whether this process has it.
      responses:
        "200":
          description: One summary per connection, in file order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/connections/{name}/repos:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getConnectionRepos
      tags: [tenant]
      summary: For a connection of type github, the repositories its token can see (GET <url>/user/repos, every page up to 1000), as an envelope of git.repository nodes, id ui:conn:<connection>/<owner>/<repo>. Read only; nothing is stored. Needs a bearer token though it is a GET, since it spends the tenant's secret (401 without one). 422 when the token variable is not set; 502 when GitHub fails or refuses.
      responses:
        "200":
          description: The repositories (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/tenants/{tenant}/feeds:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listFeeds
      tags: [feeds]
      summary: The tenant's feeds (the merged config's feeds) as an envelope of Feed nodes, ui:feed:<id>, in config order, with every card pushed to each as a Card node, ui:card:<feed>/<name>@<version> (version, type, content hash, digest, pushed, pushedBy), joined Feed to Card by has-card. The cards come from the tenant's ledger, its pushed entries.
      responses:
        "200":
          description: The feeds and their cards (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/agents:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listAgents
      tags: [agents]
      summary: The tenant's agents as an envelope (module Portal). An agent is a Principal node, ui:principal:<name>, as listPrincipals serves it. Each principal of type agent is one, and so is each principal whose token mounted a layer holding a Run. Every Run node of every mounted layer whose module is Graph.Emitter.Agent is a Run node here under its own id, agent:run/<stamp>, carrying its layer, its stamps, its step count and its decisions counted by effect (allow, deny, witness), and is joined Principal to Run by has-run. A layer mounted with no principal's token (a token from before 0.5.0, or a -mount flag at start) hangs its runs off dev-bootstrap. A Run id in two layers is served once, from the layer with the later stamp.
      responses:
        "200":
          description: The agents and their runs (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/agents/{name}/runs:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: name, in: path, required: true, description: "The principal's name, the tail of ui:principal:<name>.", schema: { type: string } }
    get:
      operationId: listAgentRuns
      tags: [agents]
      summary: One agent's runs, newest first by startedAt, as an envelope (module Portal) of the Principal, its Run nodes (as listAgents serves them) and each Run's Decision nodes, one per PolicyDecision of the layer under its own id (effect, phase, rule, step, reason), joined has-run and has-decision. 404 when name is not one of listAgents' principals.
      responses:
        "200":
          description: The agent, its runs and their decisions (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/emitters:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listEmitters
      tags: [emitters]
      summary: The tenant's emitters as an envelope (module Portal), one per name seen in a card or a layer's source block, matched by that block and never by name mangling (docs/design.md 49). An emitter is named by its card (Emitter.Agent); a mounted layer belongs to the emitter its Graph.Node source block names (source.emitter equal to the card name). An emitter some feed holds a card of is that Card node, under the card's own id ui:card:<feed>/<name>@<version> as listFeeds serves it (the newest push when several cards name it; module, repo, url and emits when the push recorded them), with emitter (its name), status, layers (how many mounted layers name it), nodes (how many nodes getTenantGraph serves with source set to its name; 0 for an unstamped module, whose layers no source filter matches) and layerVersions (the source.version of those layers, distinct, sorted). status is ok when every such layer's source.version is the card's version, version-mismatch when one differs, no-layers when none names it. A name a layer's source.emitter gives with no card in any feed is an Emitter node, ui:emitter:<name>, status no-card. A layer with no source block is never matched to a card; it is listed under its envelope's module as an Emitter node, ui:module:<module>, status unstamped. Every mounted layer is a Layer node, ui:layer:<name> (emitter, module, version, stamp, node and edge counts, mountedBy, path, and its source block when it has one), joined Layer to its emitter by produced-by and back by has-layer. Ordered by name, an unstamped module after an emitter of the same name.
      responses:
        "200":
          description: The emitters and the layers they produced (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/emitters/{name}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: name, in: path, required: true, description: "The emitter's name, as listEmitters serves it: a card's name or a layer's source.emitter (Emitter.Agent), or the module of an unstamped layer (Graph.Emitter.FileSystem).", schema: { type: string } }
    get:
      operationId: getEmitter
      tags: [emitters]
      summary: One emitter as an envelope (module Portal) rooted at its node (as listEmitters serves it), with the Layer nodes of every mounted layer it produced, newest first by stamp, joined produced-by and has-layer. A card or source.emitter name is looked up before an unstamped module of the same name. 404 when name is not one of listEmitters' emitters.
      responses:
        "200":
          description: The emitter and its layers (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/ledger:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listLedgers
      tags: [ledger]
      summary: The tenant's ledger chains as an envelope (module Portal) of Ledger nodes, ui:ledger:<source>, agent first when a ledger layer is mounted, then portal, always. Each carries source, count, valid, first and last seq, breakAt and reason when not valid, and stamp; the agent chain also its layer and claimed (its layer root's own valid), the portal chain unchained (lines from before 0.10.0). An entry follows the one before it when its seq is one more and its prev is that entry's hash (64 zeros before seq 1); breakAt is the seq of the first that does not. The agent chain is read from the mounted layer holding LedgerEntry nodes under ledger:<seq> ids, the latest stamp when several do, and is broken also when that layer's root says so.
      responses:
        "200":
          description: The chains (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/ledger/{source}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: source, in: path, required: true, description: "agent or portal.", schema: { type: string } }
    get:
      operationId: getLedger
      tags: [ledger]
      summary: One chain's entries, newest first, one page, as an envelope (module Portal) rooted at its Ledger node (as listLedgers serves it, with entries, the count matching run, and next, the before of the next page). Each entry is a LedgerEntry node (seq, stamp, prev, hash), joined from the chain by has-entry and to the entry before by prev when both are on the page. An agent entry keeps its layer's id, ledger:<seq>, with event, run, runLayer (the mounted runs layer holding that Run) and its records edge to the Run or Step by the runs layer's id, which ends in that layer; a portal entry is a line of the tenant's ledger, ledger:<seq> by its position, with by, feed, card, version, result and message, or, for an action request or result, as listActions serves it. 404 for a source listLedgers does not serve.
      parameters:
        - { name: limit, in: query, required: false, description: "Entries per page, 1 to 1000; 100 when absent.", schema: { type: integer } }
        - { name: before, in: query, required: false, description: "Only entries whose seq is lower: the next of the page before.", schema: { type: integer } }
        - { name: run, in: query, required: false, description: "Only the entries whose run is this Run id (agent:run/<stamp>).", schema: { type: string } }
      responses:
        "200":
          description: The chain and one page of its entries (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/ledger/{source}/{seq}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: source, in: path, required: true, description: "agent or portal.", schema: { type: string } }
      - { name: seq, in: path, required: true, description: "The entry's seq.", schema: { type: integer } }
    get:
      operationId: getLedgerEntry
      tags: [ledger]
      summary: One entry as an envelope (module Portal) rooted at it, as getLedger serves it, with its chain (has-entry), the entry before it (prev) and, for an agent entry, its records edge. An action request comes with its result (answered-by), and an action result with its request (answers), when the tenant's ledger holds it (docs/design.md 50). 404 for a source listLedgers does not serve or a seq the chain lacks.
      responses:
        "200":
          description: The entry, its chain and the entry before it (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/environments/graph:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getEnvironmentGraph
      tags: [environments]
      summary: >-
        The environments graph as an envelope (module Portal, no ontology of its own: its nodes keep their layers' Kinds).
        Every node of a Kind starting environment. (environment.instance, environment.image, environment.network, ...) under
        an env: id (env:compose/<project>, env:container/<project>/<service>, env:image/<reference>, env:network/<name>;
        a bare id is no environment, docs/design.md 48) in the mounted layers, under its layer's id and with its layer's properties, the first id wins in mount order, and a
        node with no stamp gets stamp.layer from its layer, as listNodes serves them. Then every edge of a mounted layer
        with an environment node at one end, its kind kept (member-of, runs-as, hosts, ...), and the node at the other end,
        one hop and no further: a Run (agent:run/<stamp>) as listAgents serves it, with its layer and ledger count; a
        Principal (ui:principal:<name>) as listPrincipals serves it, dev-bootstrap made up when principals.yaml lacks it;
        any other node as the mounted layer that holds it emits it. A served Principal holding a served Run (as listAgents
        groups them) is joined to it by has-run; no other node is added. An edge whose other end no mounted layer holds
        and Portal does not serve is left out. Empty, not 404, when no environment node is mounted.
      responses:
        "200":
          description: The environment nodes, their one-hop neighbours and the edges between them (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/graph:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenantGraph
      tags: [graph]
      summary: >-
        The tenant graph as an envelope (module Portal, no ontology of its own: its nodes keep their layers' Kinds). Every node
        of every mounted layer, the first id wins in mount order, and a node with no stamp gets stamp.layer from its layer, as
        listNodes serves them; then every edge of a mounted layer with both ends among those nodes, an edge id seen twice kept
        once. With source, only the layers whose Graph.Node source block (design 20) names that emitter are read: source.emitter
        equal to source, exact and case-sensitive, as listEmitters matches a layer to its card (docs/design.md 49, 53). Its nodes
        are kept, and an edge only when both its ends are; a layer with no source block never matches. Empty, not 404, when
        nothing matches. listEmitters' nodes is this envelope's node count for each emitter's name.
      parameters:
        - $ref: "#/components/parameters/GraphSource"
      responses:
        "200":
          description: The nodes and edges of the mounted layers, or of one emitter's (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/query:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: queryTenantGraph
      tags: [graph]
      summary: >-
        A breadth-first walk over every mounted layer at once, in memory (docs/design.md 54), as an envelope (module Portal,
        no ontology of its own: its nodes keep their layers' Kinds) with paths and query beside nodes and edges. The walk
        reads the same nodes and edges getTenantGraph serves: the first id wins in mount order, a node with no stamp gets
        stamp.layer from its layer, an alert layer's copies are left out, and source keeps the layers whose source block
        names that emitter. It starts at the from ids, or at every node of kind, and goes one hop at a time for every
        start together, each start with its own visited set, along the edges whose kind follow names, in direction, to
        depth hops. A node of Kind until is kept and not expanded (a start always is). A node enters the result only when
        every where filter matches it, and only then is it expanded; a start that fails one is left out. The result's edges
        are every edge between two of its nodes, whichever way the walk went. When the result would pass limit nodes the
        walk stops: truncated is true and truncatedAt the hop it stopped on. paths holds, for each start, the id chain to
        each node the walk stopped at: until matched, depth ran out, or nothing new lay beyond it. Empty is 200 with empty
        lists, never 404. 400 when neither from nor kind is given or both are, a from id no node has (the message names
        it), a direction other than out, in or both, a depth outside 0 to 10, a limit outside 1 to 5000, or a where
        that is not key=value.
      parameters:
        - { name: from, in: query, required: false, description: "Start node ids, comma-separated. Required unless kind is given.", schema: { type: string } }
        - { name: kind, in: query, required: false, description: "Start at every node of this Kind instead of from.", schema: { type: string } }
        - { name: follow, in: query, required: false, description: "Edge kinds to walk, comma-separated; absent or empty, every kind.", schema: { type: string } }
        - { name: direction, in: query, required: false, description: "out (the edges from a node; the default), in (the edges to it) or both.", schema: { type: string, enum: [out, in, both] } }
        - { name: depth, in: query, required: false, description: "Hops at most, 0 to 10; 3 when absent. 0 is the starts alone.", schema: { type: integer } }
        - { name: until, in: query, required: false, description: "Stop at nodes of this Kind: they are in the result, their neighbours are not.", schema: { type: string } }
        - name: where
          in: query
          required: false
          description: >-
            Repeatable key=value, every one must match a node for it to enter the result (and be expanded). The key is
            id, kind or name, else a dotted path into the node's properties (facet.key, or properties.facet.key); the
            value is matched exactly against a string, or a number or boolean as JSON writes it. A list or a map never
            matches.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - $ref: "#/components/parameters/GraphSource"
        - { name: limit, in: query, required: false, description: "Nodes at most, 1 to 5000; 500 when absent.", schema: { type: integer } }
      responses:
        "200":
          description: What the walk reached, the edges between it, the paths and the query as resolved (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphQuery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/alerts:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: >-
        The tenant's alerts, one page, as an envelope (module Portal, no ontology of its own: subjects keep their layers'
        Kinds) rooted at the node ui:alerts (Kind Alerts), joined to each Alert on the page by has-alert. The root carries
        count (every alert), alerts (those the filters match), open (the open alerts by severity: critical, warning and
        info always, and any other severity a layer gives; an alert with no state is open), rules and states (every value
        the alerts carry, for the page's chips), the filters given, and next (the after of the next page) when more match.
        Alerts are sorted critical first, then warning, then info, then any other severity, then newest stamp first, then
        by fingerprint. Each Alert keeps its layer's id, alert:<fingerprint>, with fingerprint, severity, rule, summary,
        stamp, state, open, layer (the mounted layer it was read from), about (its about edge's end) and run (its raised-in
        edge's end). Its subject and its Run are served one hop away and joined by about and raised-in, as Portal resolves
        them: a Run (agent:run/<stamp>) as listAgents serves it, a Decision (a PolicyDecision of a runs layer) as
        listAgentRuns serves it, an agent ledger entry (ledger:<seq>) as getLedgerEntry serves it, a Principal as
        listPrincipals serves it, any other node as the first mounted layer holding it emits it; an alert layer's copy of a
        node is never served. An edge whose end Portal does not serve is left out; about and run still name it. Empty, not
        404, when no alert is mounted.
      parameters:
        - { name: limit, in: query, required: false, description: "Alerts per page, 1 to 1000; 100 when absent.", schema: { type: integer } }
        - { name: after, in: query, required: false, description: "Only the alerts after this fingerprint in the order: the next of the page before.", schema: { type: string } }
        - { name: severity, in: query, required: false, description: "Only alerts of this severity (critical, warning, info).", schema: { type: string } }
        - { name: rule, in: query, required: false, description: "Only alerts this rule raised.", schema: { type: string } }
        - { name: state, in: query, required: false, description: "Only alerts in this state; open matches an alert with no state too.", schema: { type: string } }
        - { name: run, in: query, required: false, description: "Only alerts raised in this Run (agent:run/<stamp>).", schema: { type: string } }
        - { name: about, in: query, required: false, description: "Only alerts about this node id.", schema: { type: string } }
      responses:
        "200":
          description: The alerts list and one page of its alerts, with their subjects and Runs (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/alerts/{fingerprint}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: fingerprint, in: path, required: true, description: "The alert's fingerprint, its id after alert:, 64 lower-case hex.", schema: { type: string } }
    get:
      operationId: getAlert
      tags: [alerts]
      summary: One alert as an envelope (module Portal, no ontology of its own) rooted at it, as listAlerts serves it, with its subject (about) and its Run (raised-in) when Portal serves them. 404 for a fingerprint no mounted layer holds.
      responses:
        "200":
          description: The alert, its subject and its Run (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/actions:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listActions
      tags: [actions]
      summary: >-
        The tenant's action requests, newest first, as an envelope (module Portal) rooted at ui:actions (Kind Actions: count,
        and requested, done and failed, the requests by outcome), joined to each request by has-action. A request is the
        LedgerEntry of its line in the tenant's ledger, under its id ledger:tenant/<tenant>/<seq>, as getLedgerEntry serves
        it: event action.request, action, subject, principal, by, status (requested, as written) and outcome (requested
        until a later result line names it, then the result's status), with resultId and resultSeq when one does. Its result
        is the LedgerEntry of the Runner's line in the same chain, ledger:tenant/<tenant>/<seq>: event action.result, request (in this form, whatever form the line wrote), status,
        started, finished, exit, output, requestSeq, writer (the line's source, a one-item list of emitter, version, target
        and stamp) and a source block naming that emitter, ledger.jsonl and the line; joined answered-by (request to result)
        and answers (result to request). When several results name one request, the newest. Read from ledger.jsonl only,
        lines appended after boot included. Empty when no request was made.
      responses:
        "200":
          description: The requests and their results (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postAction
      tags: [actions]
      summary: >-
        Ask for an action on a container: logs, stop or restart, on a subject env:container/<project>/<service>. The principal
        is the token's, never the body's: a contributor or admin (403 for a reader, and for a token from before 0.5.0, which
        belongs to no principal; 401 without a token). Appends one action.request line to tenants/<tenant>/ledger.jsonl,
        under the file lock, after reading the lines appended since (the Runner's among them), chained like every line, and returns it as written; its id is ledger:tenant/<tenant>/<seq>, and its entry page
        /<tenant>/ledger/portal/<seq>. Any other action, or a subject that is no container id, is 422. Portal executes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionAsk" }
      responses:
        "201":
          description: Asked; the ledger line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/tenants/{tenant}/actions/{seq}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - { name: seq, in: path, required: true, description: "The request's line in the tenant's ledger, the seq of its id ledger:tenant/<tenant>/<seq>.", schema: { type: integer } }
    get:
      operationId: getAction
      tags: [actions]
      summary: One action request as an envelope (module Portal) rooted at it, as listActions serves it, with its result and the answered-by and answers edges when the tenant's ledger holds one. 404 when that line of the tenant's ledger is no action request.
      responses:
        "200":
          description: The request and its result (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/feeds/{feed}/push:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: feed
        in: path
        required: true
        description: A feed id from GET .../feeds.
        schema: { type: string }
    post:
      operationId: pushCard
      tags: [feeds]
      summary: >-
        Publish one card: its manifest.yaml and the files of its folder. The manifest is checked with Graph.Node 0.4.0's
        manifest schema (an emitter card needs module, repo and emits) (the lifted graph.ValidateManifest), and each file's path (the part's filename, relative to
        the card's folder, forward slashes; RFC 2047 encoded words, as .NET sends a non-ASCII name, decoded first) must be
        clean, each segment a Unicode letter, decimal digit or underscore and then those, combining marks, dots, spaces and
        hyphens. An oci feed gets an OCI artifact (repository: the feed URL's
        path and the card's name in lower case; tag: the version), a nuget feed a .nupkg (id: the card's name). Contributor
        or admin (403 for a reader, 401 without a token). A name and version the ledger or the feed already holds is 409.
        Every push that names a feed the tenant has is one line of the tenant's ledger, whatever its result (pushed,
        duplicate, invalid, failed), with the card's module, repo, url and emits when it has them; the 201 body is that line.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: string
                  format: binary
                  description: The card's manifest.yaml.
                file:
                  type: array
                  description: Every other file of the card's folder, one part each; the part's filename is the path relative to the folder.
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Pushed; the ledger entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/tenants/{tenant}/nodes:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listNodes
      tags: [screen, layers]
      summary: Every node of one Kind on the screen (as getScreen shows it) and in every mounted layer, read-only, first id wins. A node with no stamp gets stamp.layer from the envelope it came from. Nodes only.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: An envelope of the matching nodes (module Portal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postNode
      tags: [screen]
      summary: Add one node. The body is a Graph.Node node. Rejected unless the next screen passes Graph.Node validation and the portal ontology checks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Node" }
      responses:
        "201":
          description: The validated node, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    patch:
      operationId: patchNode
      tags: [screen]
      summary: Change a node's properties and its display State, nothing else. A property set to null is removed. state upserts the node's State node (ui:state:<id without ui:>) and its has-state edge.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchRequest" }
      responses:
        "200":
          description: The validated node and, when state was given, its State node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteNode
      tags: [screen]
      summary: Remove a node and every edge that touches it.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: The removed node and the ids of the removed edges.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/tenants/{tenant}/edges:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: postEdge
      tags: [screen]
      summary: Add one edge. The body is a Graph.Node edge; id may be left out and is then set to from|to|kind. Rejected unless the next screen validates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeInput" }
      responses:
        "201":
          description: The validated edge, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/layers:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listLayers
      tags: [layers]
      summary: The mounted data layers, in mount order.
      responses:
        "200":
          description: One summary per layer.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LayerSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: mountLayer
      tags: [layers]
      summary: Mount a layer from a path on disk (a .graph.json file, or a directory whose newest *.graph.json is taken) or from an envelope in the body. Refused with the Graph.Node problem codes when graphnode validate would fail. Mounting an existing name replaces it; tenant-actions is Portal's own (docs/design.md 55) and 400. A mount by path also records itself on the screen as the Mount node ui:mount:<name> holding the path as given (made absolute), so an approved snap mounts it again at boot; a mount by envelope removes that node. Mounts are otherwise held in memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MountRequest" }
      responses:
        "201":
          description: The mounted layer.
          headers:
            Location:
              required: true
              description: The layer's page, /<tenant>/layers/<name> (getLayerPage).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/layers:
    post:
      operationId: mountLayerUnscoped
      deprecated: true
      tags: [layers]
      summary: Gone since 0.7.0. mountLayer's path before 0.4.0; it mounts nothing and answers 410 with a message naming POST /api/tenants/<tenant>/layers. A request with a token the tenant does not hold is still 401, and a write without a token too, as for any write.
      responses:
        "410": { $ref: "#/components/responses/Gone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}/layers/{name}/nodes:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getLayerNodes
      tags: [layers]
      summary: Query one mounted layer. kind keeps nodes of that Kind; from keeps the node with that id and every node reachable from it along edges in their direction. Edges are kept when both ends survive.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: An envelope holding the matching nodes and edges of that layer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}/snap:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: postSnap
      tags: [snaps]
      summary: Approve the screen. Writes the screen graph to artifacts/snaps/<stamp>.graph.json, with ontology.yaml beside it and the note as the envelope's one finding of Kind approved, and reports what it added, removed and changed against the snap before it. The newest snap is what the next start boots from.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapRequest" }
      responses:
        "201":
          description: The snap written, and its diff against the previous snap (absent for the first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tenants/{tenant}/diff:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getDiff
      tags: [snaps]
      summary: Merge snap a then snap b the Graph.Node design 11 way, read-only, and report what b added, removed and changed. Stamps are compared as given; nothing is written.
      parameters:
        - name: a
          in: query
          required: true
          schema: { type: string }
        - name: b
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The diff and the merged envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tenants/{tenant}/ontology:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getOntology
      tags: [screen, layers]
      summary: The portal ontology and the ontology of every mounted layer (null when a layer names none or it could not be read).
      responses:
        "200":
          description: Ontologies, as decoded from YAML.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologySet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A token whose SHA-256 is in tenants/<tenant>/tokens.yaml, belonging to a principal in principals.yaml. Needed to write; optional to read. The principal's role decides which writes.
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: The tenant this process serves (PORTAL_TENANT, default "default"). Any other is 404.
      schema: { type: string }
    GraphSource:
      name: source
      in: query
      required: false
      description: An emitter's name, a card's (Emitter.Terraform). Keeps the nodes of the mounted layers whose source.emitter is exactly this, and the edges between them. Absent or empty, every mounted layer.
      schema: { type: string }
    NodeId:
      name: id
      in: path
      required: true
      description: Screen node id, e.g. ui:canvas. URL-encode it.
      schema: { type: string }
  responses:
    BadRequest:
      description: The body is not JSON of the right shape, or a parameter is missing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such node, layer, snap or file.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: A node or edge with that id already exists, or a feed already holds that card at that version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Validation failed. problems lists every Graph.Node and portal problem found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A write without a bearer token, or any request with a token the tenant does not hold.
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The principal's role does not allow this. A reader writes nothing; a contributor writes no identity or settings; no principal creates one of a role above its own (attenuation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: The service a connection or a feed names failed or answered with an error; message carries its status and message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: The path no longer serves; message names the one that does.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    TenantInfo:
      type: object
      required: [name, mode]
      additionalProperties: false
      properties:
        name: { type: string }
        mode:
          type: string
          enum: [dev, demo, prod]
          description: The overlay's mode; prod when it names none.
    DevToken:
      type: object
      required: [token, principal, role]
      additionalProperties: false
      properties:
        token:
          type: string
          description: A bearer token of the dev-bootstrap principal. DEV ONLY.
        principal:
          type: string
          description: ui:principal:dev-bootstrap.
        role:
          type: string
          description: admin.
    Config:
      type: object
      description: The merged config; schema/portal.schema.json is authoritative.
      required: [product, menu, mode]
      additionalProperties: true
      properties:
        mode:
          type: string
          enum: [dev, demo, prod]
          description: What the tenant is run for; prod when the overlay names none (docs/design.md 39).
        product:
          type: object
          required: [name]
          properties:
            name: { type: string }
            help: { type: string }
        theme:
          type: object
          description: The shell's own settings, not node display (State and Theme nodes hold that).
          properties:
            graph:
              type: object
              properties:
                wheelZoomSpeed:
                  type: number
                  minimum: 0.1
                  maximum: 5
                  description: Scales the Canvas's mouse-wheel zoom step; 1.0 (the base's) is the product's step.
        menu:
          type: array
          items: { type: object, additionalProperties: true }
    Principal:
      type: object
      required: [id, name, type, role, anonymous, legacy, writes, administers, tenant]
      properties:
        id:
          type: string
          nullable: true
          description: ui:principal:<name>; null for anonymous and for a legacy token.
        name:
          type: string
          description: The principal's name, a legacy token's name in tokens.yaml, or anonymous.
        type:
          type: string
          nullable: true
          description: user or agent; null for anonymous and for a legacy token.
        role:
          type: string
          nullable: true
          description: reader, contributor or admin; null for anonymous, admin for a legacy token.
        anonymous: { type: boolean }
        legacy:
          type: boolean
          description: A token from before 0.5.0 that names no principal; it acts as admin until rotated.
        writes:
          type: boolean
          description: Whether this principal may write at all (contributor or admin).
        administers:
          type: boolean
          description: Whether this principal may write identity and settings (admin).
        tenant: { type: string }
        marker:
          type: string
          nullable: true
          description: Who holds the tenant's marker. Nothing issues markers yet, so always null.
    ConnectionSummary:
      type: object
      required: [name, type, url, token_env, tokenSet, createdBy]
      properties:
        name: { type: string }
        type: { type: string, enum: [github] }
        url: { type: string }
        token_env:
          type: string
          description: The name of the environment variable holding the secret; never the secret.
        tokenSet:
          type: boolean
          description: Whether that variable is set in the portal's environment.
        createdBy:
          type: string
          nullable: true
          description: The id of the principal who made the connection (connections.yaml created_by); null in a file from before 0.5.0.
    PrincipalRequest:
      type: object
      required: [name, role]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Lower-case letters, digits, dot, underscore and dash, starting with a letter or digit, at most 64; the id is ui:principal:<name>.
        role:
          type: string
          description: reader, contributor or admin; at most the caller's.
        type:
          type: string
          description: user, the default and the only type created here (agents are minted via Marker, later).
    TokenSummary:
      type: object
      required: [id, principal, name, created, legacy]
      properties:
        id:
          type: string
          description: The first 12 hex digits of the token's SHA-256.
        principal:
          type: string
          nullable: true
          description: The owner's id; null for a legacy token.
        name:
          type: string
          description: The owner's name, or a legacy token's own.
        created:
          type: string
          nullable: true
          description: When New-PortalToken minted it; null for a legacy token.
        legacy: { type: boolean }
    LedgerEntry:
      type: object
      description: One line of tenants/<tenant>/ledger.jsonl, one per push (docs/design.md 40), chained to the line before by seq and prev (45).
      required: [at, principal, name, role, feed, kind, card, version, type, hash, digest, files, result, message]
      additionalProperties: false
      properties:
        at: { type: string, description: "When, UTC (2026-10-11T09:00:00.000Z)." }
        principal: { type: string, nullable: true, description: "Who pushed: ui:principal:<name>; null for a legacy token." }
        name: { type: string, description: "The principal's name, or a legacy token's." }
        role: { type: string, description: "contributor or admin." }
        feed: { type: string, description: "The feed id." }
        kind: { type: string, enum: [oci, nuget] }
        card: { type: string, nullable: true, description: "The card's name; null when the manifest did not say." }
        version: { type: string, nullable: true }
        type: { type: string, nullable: true, description: "emitter, skill, tool or rule." }
        hash: { type: string, nullable: true, description: "sha256:<hex> over the card's files (one line per file sorted by path: path, tab, the file's sha256, newline); null for an invalid card." }
        digest: { type: string, nullable: true, description: "What the feed stored: the OCI manifest digest or the .nupkg's sha256. Set only when pushed." }
        files: { type: integer, description: "How many files, manifest.yaml included." }
        result: { type: string, enum: [pushed, duplicate, invalid, failed] }
        message: { type: string }
        seq: { type: integer, description: "The line's number in the ledger, from 1 (docs/design.md 45). Every push writes it; only a line from before 0.10.0 lacks it." }
        prev: { type: string, description: "SHA-256 of the line before, 64 lower-case hex; 64 zeros for the first line. Written with seq." }
        module: { type: string, description: "The card's module (Graph.Node 0.4.0; required on an emitter card): the module its envelopes name. Written from 0.13.0 when the card has one (docs/design.md 49)." }
        repo: { type: string, description: "The card's source repository, by name. Written with module." }
        url: { type: string, description: "Where the card's repository lives, http(s). Written when the card has one." }
        emits:
          type: array
          description: "The card's emits, one item per facet: the facet and the node Kinds a layer of it holds. Written when the card has them."
          items:
            type: object
            required: [facet, kinds]
            additionalProperties: false
            properties:
              facet: { type: string }
              kinds: { type: array, items: { type: string } }
    ActionAsk:
      type: object
      description: What postAction asks for. Who asks is the token's principal, never named here.
      required: [action, subject]
      additionalProperties: false
      properties:
        action: { type: string, description: "logs, stop or restart; any other is 422." }
        subject: { type: string, description: "A container: env:container/<project>/<service>; any other id is 422." }
    ActionRequest:
      type: object
      description: One action.request line of tenants/<tenant>/ledger.jsonl, member for member as written (docs/design.md 50), the shape Portal.Agent's Runner reads.
      required: [kind, id, action, subject, principal, requested, status, seq, prev]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [action.request] }
        id: { type: string, description: "ledger:tenant/<tenant>/<seq>, seq the line's number in the tenant's ledger (docs/api/actions.md)." }
        action: { type: string, enum: [logs, stop, restart] }
        subject: { type: string, description: "env:container/<project>/<service>." }
        principal: { type: string, description: "Who asked: ui:principal:<name>, from the token." }
        requested: { type: string, description: "When, UTC (2026-10-11T09:00:00.000Z)." }
        status: { type: string, enum: [requested] }
        seq: { type: integer, description: "The line's number in the ledger, from 1, as every line since 0.10.0." }
        prev: { type: string, description: "SHA-256 of the line before, 64 lower-case hex; 64 zeros for the first line." }
        legacyId: { type: string, description: "On a line migrated at 0.16.1 only, never on one postAction writes: the id it carried before, ledger:<seq>." }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        problems:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
    Problem:
      type: object
      description: One validation failure. Graph.Node codes (schema, duplicate-node, duplicate-edge, dangling-edge, edge-id, edgeid, counts, kind, stamp, display, action) and portal codes (id-prefix, unknown-kind, unknown-property, property-type, display, unknown-edge-kind, edge-endpoints, unknown-category, unknown-ref, unknown-field, ontology).
      required: [code, path, message]
      properties:
        code: { type: string }
        path: { type: string }
        message: { type: string }
        severity:
          type: string
          enum: [error, warning]
          description: Graph.Node 0.2.0 severity. A refusal carries errors only; a layer ontology's ontologyProblems may hold warnings.
    Counts:
      type: object
      required: [nodes, edges]
      properties:
        nodes: { type: integer }
        edges: { type: integer }
        byKind:
          type: object
          additionalProperties: { type: integer }
    Envelope:
      type: object
      description: A Graph.Node envelope (graph/1). The schemas in internal/graphnode/schemas are authoritative.
      required: [schema, module, layer, nodes, edges]
      properties:
        schema:
          type: string
          enum: [graph/1]
        ontology: { type: string }
        module: { type: string }
        version: { type: string }
        layer: { type: string }
        root: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        counts: { $ref: "#/components/schemas/Counts" }
    GraphQuery:
      description: >-
        A Graph.Node envelope (graph/1; members beside an envelope's are allowed) with what queryTenantGraph adds: paths,
        query, and truncated with truncatedAt when the node cap was hit.
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [paths, query, truncated]
          properties:
            paths:
              type: array
              description: For each start, the id chain from it to each node the walk stopped at.
              items: { type: array, items: { type: string } }
            truncated: { type: boolean, description: "True when limit stopped the walk." }
            truncatedAt: { type: integer, description: "With truncated, the hop the walk stopped on (0: among the starts)." }
            query:
              type: object
              description: The parameters as resolved, defaults filled in.
              required: [from, follow, direction, depth, where, limit]
              properties:
                from: { type: array, items: { type: string } }
                kind: { type: string }
                follow: { type: array, items: { type: string } }
                direction: { type: string, enum: [out, in, both] }
                depth: { type: integer }
                until: { type: string }
                where: { type: array, items: { type: string } }
                source: { type: string }
                limit: { type: integer }
    Node:
      type: object
      description: A Graph.Node node. A display key is refused (Graph.Node), and so are display properties on any Kind but State and Theme (portal).
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        properties: { $ref: "#/components/schemas/Properties" }
        source:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        stamp: { $ref: "#/components/schemas/Stamp" }
    Edge:
      type: object
      required: [id, kind, from, to]
      properties:
        id:
          type: string
          description: from + "|" + to + "|" + kind
        kind: { type: string }
        from: { type: string }
        to: { type: string }
        properties: { $ref: "#/components/schemas/Properties" }
        source:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        stamp: { $ref: "#/components/schemas/Stamp" }
    EdgeInput:
      type: object
      description: An Edge whose id may be left out.
      required: [kind, from, to]
      properties:
        id: { type: string }
        kind: { type: string }
        from: { type: string }
        to: { type: string }
        properties: { $ref: "#/components/schemas/Properties" }
    Properties:
      type: object
      additionalProperties: true
    SourceRef:
      type: object
      properties:
        tool: { type: string }
        command: { type: string }
        path: { type: string }
        file: { type: string }
        line: { type: integer }
    Stamp:
      type: object
      properties:
        layer: { type: string }
        firstSeen: { type: string }
        lastSeen: { type: string }
    Finding:
      type: object
      required: [kind, message]
      additionalProperties: true
      properties:
        kind: { type: string }
        severity: { type: string }
        message: { type: string }
        target: { type: string }
    StateProperties:
      type: object
      additionalProperties: false
      properties:
        collapsed: { type: boolean, nullable: true }
        selected: { type: boolean, nullable: true }
        scroll:
          type: object
          nullable: true
          properties:
            x: { type: number }
            y: { type: number }
    PatchRequest:
      type: object
      additionalProperties: false
      properties:
        properties: { $ref: "#/components/schemas/Properties" }
        state: { $ref: "#/components/schemas/StateProperties" }
    PatchResult:
      type: object
      required: [node]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        state: { $ref: "#/components/schemas/Node" }
    DeleteResult:
      type: object
      required: [node, edges]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        edges:
          type: array
          items: { type: string }
    MountRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        path:
          type: string
          description: A .graph.json file, or a directory whose newest *.graph.json (by name) is mounted. The envelope's ontology is resolved relative to the file.
        envelope:
          type: object
          additionalProperties: true
          description: An envelope given inline. Exactly one of path and envelope.
    LayerSummary:
      type: object
      required: [name, module, stamp, counts, hasOntology]
      properties:
        name: { type: string }
        module: { type: string }
        version: { type: string }
        stamp:
          type: string
          description: The envelope's layer stamp.
        path:
          type: string
          description: The file mounted, when mounted from disk.
        mountedBy:
          type: string
          description: Id of the principal whose token mounted the layer (ui:principal:<name>). Absent when none did, a token from before 0.5.0 or a -mount flag at start; listAgents then hangs its runs off dev-bootstrap.
        counts: { $ref: "#/components/schemas/Counts" }
        hasOntology: { type: boolean }
        ontologyProblems:
          type: array
          description: Present when the layer names an ontology that could not be read or failed graphnode validate-ontology; the layer is mounted without it and draws grey.
          items: { $ref: "#/components/schemas/Problem" }
    SnapRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
          description: Why this screen is approved. Stored as the snap envelope's approved finding.
    SnapResult:
      type: object
      required: [stamp, layer, path, counts, note]
      properties:
        stamp:
          type: string
          description: File-safe stamp, the snap's name (2026-10-09T01-02-03.456Z).
        layer:
          type: string
          description: The envelope's layer, UTC ending Z (2026-10-09T01:02:03.456Z).
        path: { type: string }
        counts: { $ref: "#/components/schemas/Counts" }
        note: { type: string, description: "The note as given, trimmed; empty when none." }
        previous:
          type: string
          description: Stamp of the newest snap before this one. Absent for the first snap.
        diff: { $ref: "#/components/schemas/DiffSummary" }
    Ids:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { type: string }
        edges:
          type: array
          items: { type: string }
    DiffSummary:
      type: object
      description: Ids of what this snap added, removed and changed against previous; GET /api/diff gives the full diff.
      required: [added, removed, changed]
      properties:
        added: { $ref: "#/components/schemas/Ids" }
        removed: { $ref: "#/components/schemas/Ids" }
        changed: { $ref: "#/components/schemas/Ids" }
    Delta:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }
    Change:
      type: object
      required: [id, before, after]
      properties:
        id: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
    Changes:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Change" }
    Diff:
      type: object
      required: [a, b, added, removed, changed, merged]
      properties:
        a: { type: string }
        b: { type: string }
        added: { $ref: "#/components/schemas/Delta" }
        removed: { $ref: "#/components/schemas/Delta" }
        changed: { $ref: "#/components/schemas/Changes" }
        merged: { $ref: "#/components/schemas/Envelope" }
    OntologySet:
      type: object
      required: [portal, layers]
      properties:
        portal: { type: object, additionalProperties: true }
        layers:
          type: object
          additionalProperties:
            type: object
            nullable: true
            additionalProperties: true
