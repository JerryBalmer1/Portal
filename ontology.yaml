module: Portal
version: 0.12.0
kinds:
  Container:
    description: A box on screen that holds Containers and Widgets through contains edges. The root Container is the one no contains edge points at. A Container that is-a the Menu Category is a menu entry, drawn in the top bar and not on the screen; its opens edge names what it shows.
    idRule: "ui:<name>; the dev seed's root is ui:root"
    properties:
      - { name: parent, type: string, description: "Id of the Container that contains this one; informational, the contains edge decides." }
      - { name: bounds, type: object, description: "{x, y, w, h}, as on a Widget, for a Container placed inside another." }
      - { name: order, type: integer, description: "Sort key among siblings, ascending." }
      - { name: visible, type: boolean, description: "false hides the Container and everything in it. Absent means true." }
  Widget:
    description: A panel that draws something. Its Category (is-a) decides how; its source says what.
    idRule: "ui:<name>"
    properties:
      - { name: type, type: string, description: "Name of the Category it is-a; informational, the is-a edge decides. Must name a Category node when present." }
      - { name: source, type: string, description: "A mounted layer name, optionally with a query: filesystem or filesystem?kind=File&from=fs:src." }
      - { name: bounds, type: object, description: "{x, y, w, h}: grid cells under a grid Layout, pixels under a canvas Layout, ignored under flow." }
      - { name: order, type: integer, description: "Sort key among siblings, ascending." }
      - { name: visible, type: boolean, description: "false hides the Widget. Absent means true." }
  Layout:
    description: How a Container arranges its children. Joined to the Container by laid-out-by.
    idRule: "ui:layout:<name>"
    properties:
      - { name: mode, type: string, required: true, description: "grid, flow or canvas." }
      - { name: columns, type: integer, description: "Grid columns; grid mode only. Absent means 12." }
  Category:
    description: A panel type. Graph.Node base Kind; Widgets and Containers join it by is-a, and a Category may is-a another to inherit its renderer.
    idRule: "ui:category:<name>"
    properties:
      - { name: label, type: string, required: true, description: "Required by Graph.Node's Category schema; equals the node name." }
      - { name: description, type: string }
  State:
    description: Per-node display state. With Theme, the only Kinds that may carry display properties. Joined from its node by has-state. The Designer also holds one per section, whether that section is collapsed.
    idRule: "ui:state:<id of the node without ui:>; a Designer section's is ui:state:<id of the Designer without ui:>:<section slug>, ui:state:designer:add-panel for the seed's"
    properties:
      - { name: collapsed, type: boolean }
      - { name: selected, type: boolean }
      - { name: scroll, type: object, description: "{x, y} in pixels." }
      - { name: icon, type: string, description: "Icon name of a rail Service or Page (GET /api/tenants/{tenant}/menu), from the product's icon set." }
  Theme:
    description: How a Container and everything in it looks. Joined from the Container by themed-by; a Container without one takes its parent's. A display Kind, like State, and a node like any other, so a theme change is a changed node in a diff.
    idRule: "ui:theme:<name>; the dev seed's is ui:theme:default"
    properties:
      - { name: color, type: string, description: "Accent colour, #rrggbb." }
      - { name: opacity, type: number, description: "Opacity of the glass surface of panels, 0 to 1." }
      - { name: font, type: string, description: "CSS font-family." }
  Ref:
    description: A stand-in on screen for one node of a mounted data layer, so a displays edge stays inside the screen envelope (Graph.Node rejects dangling edges).
    idRule: "ui:ref:<layer>/<data node id>"
    properties:
      - { name: layer, type: string, required: true, description: "Mounted layer name." }
      - { name: node, type: string, required: true, description: "Node id in that layer." }
  Mount:
    description: A data layer mounted by path through POST /api/tenants/{tenant}/layers, recorded on screen so an approved snap mounts it again at boot. Written by the mount, removed by a mount of the same name from an inline envelope; it draws nothing and has no edges.
    idRule: "ui:mount:<layer name>"
    properties:
      - { name: layer, type: string, required: true, description: "The layer name, as the mount took it." }
      - { name: path, type: string, required: true, description: "The path as given, made absolute: a .graph.json file, or a directory whose newest *.graph.json is mounted at boot." }
      - { name: mountedBy, type: string, description: "Id of the principal whose token mounted it, so its runs group under that principal again after a boot (docs/design.md 43). Absent for a token that names no principal." }
  Service:
    description: One entry of the shell's left rail, built from the tenant's merged config (portal.base.yaml, then tenants/<tenant>/portal.yaml) and served by GET /api/tenants/{tenant}/menu. Never on the screen graph. Its pages hang off it by has-page; its icon is its State's.
    idRule: "ui:rail:<service id>"
    properties:
      - { name: path, type: string, required: true, description: "Route segment under the tenant: /<tenant>/<path>." }
      - { name: order, type: integer, description: "Position in the rail, ascending." }
      - { name: dock, type: string, description: "top or bottom; bottom is pinned to the foot of the rail (Settings). Absent means top." }
  Page:
    description: One page of a rail Service, or a tab of an item page when it hangs off another Page. Served in the menu envelope only.
    idRule: "ui:rail:<service id>:<page id>[:<child id>...]"
    properties:
      - { name: path, type: string, required: true, description: "Route under the tenant: <service>/<page>." }
      - { name: order, type: integer, description: "Position among its siblings, ascending." }
      - { name: nodeKind, type: string, description: "The Kind the page lists through GET /api/tenants/{tenant}/nodes?kind=." }
      - { name: view, type: string, description: "table (absent means table), screen, connections, users, agents, tokens, feeds, layers, emitters or ledger: which page renderer draws it." }
      - { name: screen, type: string, description: "With view screen: the screen node the page draws (ui:canvas, ui:designer)." }
      - { name: sections, type: array, description: "With view screen on a Designer: the section slugs drawn; absent means all." }
      - { name: filter, type: array, description: "Values of properties.kind the page offers as toolbar filters (Instances: container, compose, kubernetes, host)." }
  Principal:
    description: Who may hold a bearer token in a tenant, and with what role (docs/design.md 38). Read from tenants/<tenant>/principals.yaml and served by GET /api/tenants/{tenant}/principals; never on the screen graph. A token in tokens.yaml belongs to one. An admin adds one through POST .../principals, of a role at most its own (attenuation).
    idRule: "ui:principal:<name>"
    properties:
      - { name: type, type: string, required: true, description: "user or agent. Only users are created in 0.5.0; agents are minted via Marker, later." }
      - { name: role, type: string, required: true, description: "reader (GET only), contributor (every write but identity and settings) or admin (all)." }
      - { name: created, type: string, description: "When it was created, UTC (2026-10-11T09:00:00.000Z). Absent only on dev-bootstrap in GET .../agents when principals.yaml does not hold it (docs/design.md 43)." }
      - { name: createdBy, type: string, description: "Id of the principal that created it. Absent only on the tenant's first admin, made by New-PortalToken -Bootstrap." }
  Run:
    description: One agent run, as GET /api/tenants/{tenant}/agents serves it (docs/design.md 43). It is a Run node of a mounted layer whose module is Graph.Emitter.Agent, under that node's own id, with the counts of what it contains. Portal mints no id under agent:, which Graph.Emitter.Agent owns; it re-serves the emitter's. Joined from the principal whose token mounted its layer by has-run; never on the screen graph.
    idRule: "agent:run/<stamp>, the emitter's Run id as it is in the layer"
    properties:
      - { name: layer, type: string, required: true, description: "The mounted layer the Run is in; its page is /<tenant>/layers/<layer>." }
      - { name: startedAt, type: string, required: true, description: "The emitter's startedAt, UTC ending Z." }
      - { name: stopped, type: boolean, required: true, description: "The emitter's stopped." }
      - { name: finishedAt, type: string, description: "The emitter's finishedAt; absent when not stopped." }
      - { name: exit, type: integer, description: "The emitter's exit; absent when it has none." }
      - { name: steps, type: integer, required: true, description: "Step nodes the Run contains." }
      - { name: allow, type: integer, required: true, description: "PolicyDecision nodes under the Run whose effect is allow." }
      - { name: deny, type: integer, required: true, description: "PolicyDecision nodes under the Run whose effect is deny." }
      - { name: witness, type: integer, required: true, description: "PolicyDecision nodes under the Run whose effect is witness." }
      - { name: ledger, type: integer, description: "Entries of the agent's ledger chain whose run is this Run (docs/design.md 45); absent when no ledger layer is mounted." }
      - { name: alerts, type: integer, description: "Alerts raised in this Run, by their raised-in edge (docs/design.md 47); absent when no alert is mounted." }
  Decision:
    description: One policy decision of a Run, a PolicyDecision node of the same layer under its own id. Served by GET /api/tenants/{tenant}/agents/{name}/runs only, joined from its Run by has-decision; never on the screen graph.
    idRule: "agent:run/<stamp>/step-<n>/<pre|post>, the emitter's PolicyDecision id as it is in the layer"
    properties:
      - { name: layer, type: string, required: true, description: "The mounted layer the decision is in." }
      - { name: effect, type: string, required: true, description: "allow, deny or witness." }
      - { name: phase, type: string, required: true, description: "pre or post." }
      - { name: rule, type: string, required: true, description: "rules[n] or default, as ledgered." }
      - { name: step, type: integer, required: true, description: "The ordinal of the Step it was made on." }
      - { name: reason, type: string, description: "The hook's reason; pre decisions only." }
  Feed:
    description: Where cards are published (docs/design.md 40). Built from the merged config's feeds (portal.base.yaml, then tenants/<tenant>/portal.yaml) and served by GET /api/tenants/{tenant}/feeds with the cards pushed to it; never on the screen graph. POST .../feeds/<id>/push publishes a card, contributor or admin.
    idRule: "ui:feed:<feed id>"
    properties:
      - { name: kind, type: string, required: true, description: "oci (an OCI registry; a card is an OCI artifact) or nuget (a NuGet v3 feed; a card is a .nupkg)." }
      - { name: url, type: string, required: true, description: "oci: the registry and repository namespace. nuget: the v3 service index." }
      - { name: visibility, type: string, required: true, description: "private or public. Recorded, not enforced in 0.6.0." }
      - { name: order, type: integer, description: "Position in the config's feeds list." }
      - { name: tokenEnv, type: string, description: "The environment variable holding the feed's API key; never the key." }
  Card:
    description: A Graph.Node manifest card as one feed holds it, from the tenant's ledger (tenants/<tenant>/ledger.jsonl, one line per push). Its name is the card's name. Joined from its Feed by has-card in GET .../feeds. A card of type emitter is an emitter (docs/design.md 44), served under the same id by GET .../emitters with emitter and layers, joined to the layers it produced by has-layer.
    idRule: "ui:card:<feed id>/<card name>@<version>"
    properties:
      - { name: feed, type: string, required: true, description: "The feed id." }
      - { name: version, type: string, required: true, description: "The card's version (Semantic Versioning 2.0.0)." }
      - { name: type, type: string, required: true, description: "emitter, skill, tool or rule, from the card." }
      - { name: hash, type: string, required: true, description: "sha256:<hex> over the card's files: one line per file, sorted by path, <path> TAB <sha256 of the file> LF. The same whatever feed holds it." }
      - { name: digest, type: string, description: "The feed's own name for what it stored: the OCI manifest digest, or the .nupkg's sha256." }
      - { name: pushed, type: string, required: true, description: "When it was pushed, UTC (2026-10-11T09:00:00.000Z)." }
      - { name: pushedBy, type: string, required: true, description: "The name of the principal who pushed it." }
      - { name: emitter, type: string, description: "GET .../emitters only: the emitter the card is, named as its layers' ontology module names it (Graph.Emitter.<X> for the card Emitter.<X>)." }
      - { name: layers, type: integer, description: "GET .../emitters only: how many mounted layers the emitter produced." }
  Emitter:
    description: An emitter a mounted layer's ontology names that no feed holds a card of (docs/design.md 44), served by GET /api/tenants/{tenant}/emitters flagged unknown. An emitter with a card is that Card; this Kind exists only because a Card is a push to a feed (feed, version, hash, pushed), which an emitter known by name alone has none of. Never on the screen graph.
    idRule: "ui:emitter:<the module the layer's ontology names>"
    properties:
      - { name: unknown, type: boolean, required: true, description: "Always true: no feed of the tenant holds a card of this emitter." }
      - { name: layers, type: integer, required: true, description: "How many mounted layers name it." }
  Layer:
    description: A mounted data layer, as GET /api/tenants/{tenant}/emitters serves it (docs/design.md 44), joined to the emitter that produced it by produced-by. Its page is /<tenant>/layers/<name>. Never on the screen graph; a path mount's record there is its Mount.
    idRule: "ui:layer:<layer name>"
    properties:
      - { name: emitter, type: string, required: true, description: "The emitter that produced it: the module its ontology names, or the envelope's module when the portal could not read its ontology." }
      - { name: module, type: string, required: true, description: "The envelope's module." }
      - { name: version, type: string, description: "The envelope's version." }
      - { name: stamp, type: string, required: true, description: "The envelope's layer stamp." }
      - { name: nodes, type: integer, required: true, description: "Nodes in the layer." }
      - { name: edges, type: integer, required: true, description: "Edges in the layer." }
      - { name: mountedBy, type: string, description: "Id of the principal whose token mounted it; absent when none did (a token from before 0.5.0, a mount at start)." }
      - { name: path, type: string, description: "The file mounted, when mounted from disk." }
  Ledger:
    description: One ledger chain, as GET /api/tenants/{tenant}/ledger serves it (docs/design.md 45), with its verify. Source agent is the agent's ledger, read from the mounted layer holding LedgerEntry nodes under ledger:<seq> ids; source portal is Portal's own push ledger, tenants/<tenant>/ledger.jsonl. Joined to its entries by has-entry. Never on the screen graph.
    idRule: "ui:ledger:<source>, agent or portal"
    properties:
      - { name: source, type: string, required: true, description: "agent or portal." }
      - { name: count, type: integer, required: true, description: "Entries in the chain, unchained ones included." }
      - { name: valid, type: boolean, required: true, description: "Whether every entry follows the one before it: seq one more, prev that entry's hash (64 zeros before seq 1); for the agent chain, also whether its layer's own verify says so." }
      - { name: first, type: integer, description: "The lowest seq; absent for an empty chain." }
      - { name: last, type: integer, description: "The highest seq; absent for an empty chain." }
      - { name: breakAt, type: integer, description: "When not valid: the seq of the first entry that does not follow the one before it." }
      - { name: reason, type: string, description: "When not valid: prev-mismatch, seq-gap, unchained (a line without seq and prev after the chain began) or layer (the layer's own verify)." }
      - { name: stamp, type: string, description: "The agent chain's layer stamp; Portal's own newest entry's time. Absent for an empty chain." }
      - { name: layer, type: string, description: "Source agent: the mounted layer read; its page is /<tenant>/layers/<layer>." }
      - { name: claimed, type: boolean, description: "Source agent: the valid its layer's root node gives, when it gives one." }
      - { name: unchained, type: integer, description: "Source portal: lines written before 0.10.0, without seq and prev, at the head of the file." }
      - { name: entries, type: integer, description: "GET .../ledger/{source} only: entries matching its run filter." }
      - { name: run, type: string, description: "GET .../ledger/{source} only: the run filter, when given." }
      - { name: next, type: integer, description: "GET .../ledger/{source} only: the before to ask for the next page; absent on the last." }
  LedgerEntry:
    description: One entry of a ledger chain (docs/design.md 45). An agent entry keeps the id its layer gave it, ledger:<seq>, the registered shape (Claude.Agent.Alerts' prefix; the same ids as the Alerts layer's ledger nodes), and Portal never mints one; a Portal entry is ui:ledger:portal/<seq>. Joined from its Ledger by has-entry, to the entry before by prev, and to the Run or Step it belongs to by records. Never on the screen graph.
    idRule: "ledger:<seq> (source agent, as in its layer); ui:ledger:portal/<seq> (source portal, seq its line number from 1)"
    properties:
      - { name: source, type: string, required: true, description: "agent or portal." }
      - { name: seq, type: integer, required: true, description: "Its seq: the writer's for the agent; the line number for Portal's own." }
      - { name: stamp, type: string, required: true, description: "When it was written, UTC." }
      - { name: hash, type: string, required: true, description: "SHA-256 of its line, 64 lower-case hex: the layer's for the agent, computed from the line's bytes for Portal's own." }
      - { name: prev, type: string, description: "The hash of the line before, as the line names it; absent on an unchained line." }
      - { name: unchained, type: boolean, description: "Source portal: a line written before 0.10.0, without seq and prev." }
      - { name: written, type: integer, description: "Source portal: the seq the line says, when it is not its line number." }
      - { name: event, type: string, description: "Source agent: the line's kind (agent.start, policy.pre, ...)." }
      - { name: run, type: string, description: "Source agent: the Run id it belongs to, when it belongs to a run." }
      - { name: runLayer, type: string, description: "Source agent: the mounted runs layer holding that Run; the run's link is /<tenant>/layers/<runLayer>#<id>." }
      - { name: by, type: string, description: "Source portal: who pushed." }
      - { name: feed, type: string, description: "Source portal: the feed pushed to." }
      - { name: card, type: string, description: "Source portal: the card's name, when the manifest gave one." }
      - { name: version, type: string, description: "Source portal: the card's version, when the manifest gave one." }
      - { name: result, type: string, description: "Source portal: pushed, duplicate, invalid or failed." }
      - { name: message, type: string, description: "Source portal: the push's message." }
  Alerts:
    description: The tenant's alerts, as GET /api/tenants/{tenant}/alerts serves them (docs/design.md 47), one page joined by has-alert, with the counts the page's chips and the banner's badge read. Never on the screen graph.
    idRule: "ui:alerts"
    properties:
      - { name: count, type: integer, required: true, description: "Every alert of the mounted layers." }
      - { name: alerts, type: integer, required: true, description: "The alerts the filters match." }
      - { name: open, type: object, required: true, description: "The open alerts (state open, or none) by severity: critical, warning and info always, and any other severity a layer gives. The banner's badge reads it." }
      - { name: rules, type: array, required: true, description: "Every rule the alerts carry, sorted: the rule chips." }
      - { name: states, type: array, required: true, description: "Every state the alerts carry (open for none), sorted: the state chips." }
      - { name: next, type: string, description: "The after of the next page, when more match." }
      - { name: severity, type: string, description: "The severity filter, when given; rule, state, run and about likewise." }
  Alert:
    description: "One alert of a mounted alert layer (Portal.Agent's agent-alerts layer; docs/design.md 47), a node of Kind alert under that layer's own id, which Portal never mints and never writes. Joined from Alerts by has-alert, to its subject by about and to its Run by raised-in when Portal serves them. Never on the screen graph."
    idRule: "alert/<fingerprint>, the layer's id as it is in the layer (plain: no prefix)"
    properties:
      - { name: fingerprint, type: string, required: true, description: "The id after alert/: its item page is /<tenant>/compliance/alerts/<fingerprint>." }
      - { name: severity, type: string, required: true, description: "critical, warning or info, as the layer gives it." }
      - { name: rule, type: string, required: true, description: "The rule that raised it." }
      - { name: summary, type: string, required: true, description: "What the rule saw." }
      - { name: stamp, type: string, required: true, description: "When it was raised." }
      - { name: open, type: boolean, required: true, description: "Whether its state is open, or it has none." }
      - { name: layer, type: string, required: true, description: "The mounted layer it was read from; the later stamp's when two layers hold its fingerprint." }
      - { name: state, type: string, description: "open, acknowledged, resolved or any other the layer gives; absent when it gives none." }
      - { name: about, type: string, description: "The id its about edge names, served or not." }
      - { name: run, type: string, description: "The Run id its raised-in edge names, served or not." }
edgeKinds:
  contains:
    description: A Container holds a Container or a Widget.
    from: [Container]
    to: [Container, Widget]
  laid-out-by:
    description: A Container is arranged by a Layout.
    from: [Container]
    to: [Layout]
  is-a:
    description: A Widget or Container is of a Category; a Category may refine another.
    from: [Widget, Container, Category]
    to: [Category]
  opens:
    description: A menu entry (a Container that is-a Menu) shows a Container or a Widget on screen when chosen in the top bar.
    from: [Container]
    to: [Container, Widget]
  displays:
    description: A Widget shows one node of a mounted data layer, through its Ref.
    from: [Widget]
    to: [Ref]
  has-page:
    description: A rail Service to its pages, or a Page to the tabs of its item page.
    from: [Service, Page]
    to: [Page]
  has-card:
    description: A Feed to a Card pushed to it.
    from: [Feed]
    to: [Card]
  has-run:
    description: A Principal to each Run in a layer its token mounted; a Run of a layer mounted with no principal's token hangs off dev-bootstrap (docs/design.md 43).
    from: [Principal]
    to: [Run]
  has-decision:
    description: A Run to each of its policy decisions.
    from: [Run]
    to: [Decision]
  produced-by:
    description: A mounted Layer to the emitter that produced it, a Card of type emitter or an unknown Emitter (docs/design.md 44).
    from: [Layer]
    to: [Card, Emitter]
  has-layer:
    description: An emitter, a Card of type emitter or an unknown Emitter, to each mounted Layer it produced; produced-by reversed.
    from: [Card, Emitter]
    to: [Layer]
  has-entry:
    description: A Ledger chain to each of its entries served.
    from: [Ledger]
    to: [LedgerEntry]
  prev:
    description: A LedgerEntry to the entry before it in its chain, when both are served.
    from: [LedgerEntry]
    to: [LedgerEntry]
  records:
    description: An agent LedgerEntry to the Run, or the Step, of the Graph.Emitter.Agent runs layer it belongs to, by that layer's id; it ends in that layer (docs/design.md 45).
    from: [LedgerEntry]
    to: [Run, Step]
  recorded-in:
    description: records reversed, a Run or Step to each entry of the agent's ledger that belongs to it.
    from: [Run, Step]
    to: [LedgerEntry]
  has-alert:
    description: The Alerts list to each Alert on its page.
    from: [Alerts]
    to: [Alert]
  about:
    description: "An Alert to what it is about, as Portal serves it: an agent LedgerEntry, a Run, a Decision, or any node of a mounted layer (an environment instance) as that layer emits it."
    from: [Alert]
    to: [LedgerEntry, Run, Decision, Principal, environment.instance]
  raised-in:
    description: An Alert to the Run it was raised in.
    from: [Alert]
    to: [Run]
  has-state:
    description: Any screen node, or a rail Service or Page, to its display State.
    from: [Container, Widget, Layout, Category, Ref, Service, Page]
    to: [State]
  themed-by:
    description: A Container is drawn with a Theme, and so is everything it contains that has no Theme of its own.
    from: [Container]
    to: [Theme]
findingKinds:
  approved:
    description: Set by POST /api/snap on the snap envelope (not on a node); its message is the approval note.
    severity: info
  absent:
    description: Set by GET /api/diff on a node or edge present in snap a and absent from snap b; the merge keeps it rather than deleting it (Graph.Node design 11).
    severity: info
