<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal</title>
<link rel="stylesheet" href="/static/base.css">
<script src="/static/cytoscape.min.js"></script>
</head>
<body>
<header class="pt-banner" id="banner">
  <span class="pt-brand" id="brand">Portal</span>
  <nav class="pt-crumbs-nav" aria-label="Breadcrumb"><ol class="pt-crumbs" id="crumbs"></ol></nav>
  <div class="pt-banner-right">
    <label class="pt-search"><span class="pt-sr">Search this page</span><input type="search" id="search" placeholder="Search" autocomplete="off"></label>
    <span class="pt-mode" id="mode" hidden></span>
    <span class="pt-marker" id="marker">marker: none</span>
    <a class="pt-help" id="help" target="_blank" rel="noopener" hidden>Help</a>
    <button type="button" class="pt-avatar" id="avatar" aria-haspopup="dialog" aria-expanded="false" aria-controls="account">anonymous</button>
    <div class="pt-account" id="account" role="dialog" aria-label="Account" hidden></div>
  </div>
</header>
<p class="pt-modebar" id="modebar" role="status" hidden></p>
<aside class="pt-rail-wrap">
  <nav class="pt-rail" id="rail" aria-label="Services"></nav>
  <button type="button" class="pt-rail-toggle" id="rail-toggle" aria-controls="rail" aria-expanded="true" title="Collapse the rail to icons"><svg class="pt-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="pt-label">Collapse</span></button>
</aside>
<div class="pt-flyout" id="flyout" hidden></div>
<main class="pt-main" id="main">
  <h1 class="pt-title" id="title"></h1>
  <div class="pt-toolbar" id="toolbar"></div>
  <div class="pt-content" id="content"></div>
</main>
<script type="module" src="/static/portal.js"></script>
</body>
</html>
